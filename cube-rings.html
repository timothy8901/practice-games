<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#f4f1ea">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>Cube Rings</title>
<meta name="description" content="A Rubik's cube unrolled into nine rings. Swipe the dots to turn the 3D cube, learn it in the tutorial, then race the clock in Timed Mode.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='-1.62 -1.7 3.24 3.12'%3E%3Cg fill='none' stroke='%23bdb5a7' stroke-width='.1'%3E%3Ccircle cx='.5' cy='.2887' r='1'/%3E%3Ccircle cx='0' cy='-.5774' r='1'/%3E%3Ccircle cx='-.5' cy='.2887' r='1'/%3E%3C/g%3E%3Cg stroke='%232b2724' stroke-width='.07'%3E%3Ccircle cx='0' cy='-.5774' r='.24' fill='%23fbfaf5'/%3E%3Ccircle cx='-.5' cy='.2887' r='.24' fill='%231f8a4a'/%3E%3Ccircle cx='.5' cy='.2887' r='.24' fill='%23d9372b'/%3E%3Ccircle cx='0' cy='1.1547' r='.24' fill='%23f7c11e'/%3E%3Ccircle cx='-1' cy='-.5774' r='.24' fill='%23f28322'/%3E%3Ccircle cx='1' cy='-.5774' r='.24' fill='%231f4ec2'/%3E%3C/g%3E%3C/svg%3E">
<style>
  :root {
    --bg: #f4f1ea;
    --bg-deep: #e8e1d3;
    --card: #fffdf8;
    --ink: #26221f;
    --muted: #776e63;
    --line: #ddd5c7;
    --chip: #ece6da;
    --accent: #6c47ff;
    --accent-soft: #eee9ff;
    --good: #1c8a4a;
    --shadow: 0 14px 34px rgba(38, 34, 31, .16), 0 2px 8px rgba(38, 34, 31, .08);
    --font: ui-rounded, "SF Pro Rounded", "Nunito", "Segoe UI Variable Display", "Segoe UI", system-ui, -apple-system, Roboto, "Helvetica Neue", Arial, sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink); overscroll-behavior: none; }
  body {
    position: fixed; inset: 0; overflow: hidden;
    font-family: var(--font);
    -webkit-user-select: none; user-select: none;
    -webkit-tap-highlight-color: transparent; -webkit-touch-callout: none;
    -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale;
  }
  button { font: inherit; color: inherit; cursor: pointer; touch-action: manipulation; -webkit-appearance: none; appearance: none; }
  button:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
  [hidden] { display: none !important; }

  #app {
    position: absolute; inset: 0; display: flex; flex-direction: column;
    padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
    background: radial-gradient(130% 75% at 50% 0%, #fbf9f4 0%, var(--bg) 55%, var(--bg-deep) 100%);
  }

  /* ---------- HUD ---------- */
  #hud { flex: none; display: flex; align-items: center; gap: 8px; padding: 8px 12px 2px; min-height: 62px; }
  #hud.off { display: none; }
  .icon-btn {
    flex: none; width: 46px; height: 46px; border-radius: 15px; border: 0; padding: 0;
    background: var(--card); box-shadow: 0 1px 0 rgba(0,0,0,.04), 0 4px 12px rgba(38,34,31,.10);
    display: grid; place-items: center; transition: transform .12s ease, opacity .2s ease;
  }
  .icon-btn:active { transform: scale(.93); }
  .icon-btn:disabled { opacity: .32; cursor: default; }
  .icon-btn svg { width: 22px; height: 22px; stroke: currentColor; fill: none; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
  .hud-mid { flex: 1; min-width: 0; text-align: center; }
  #timer { font-size: 31px; font-weight: 800; font-variant-numeric: tabular-nums; letter-spacing: .01em; line-height: 1; }
  #timer.idle { color: #9a9185; }
  #timer.done { color: var(--good); }
  #timer.label { font-size: 22px; letter-spacing: 0; }
  #hudSub { margin-top: 4px; font-size: 12.5px; font-weight: 700; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  /* ---------- Stage ---------- */
  #stage {
    flex: 1; min-height: 0; position: relative; display: grid;
    grid-template-columns: 100%; grid-template-rows: auto minmax(0, 1fr) auto;
    grid-template-areas: "coach" "cube" "graph";
  }
  #stage.landscape {
    grid-template-columns: minmax(0, 1fr) auto; grid-template-rows: auto minmax(0, 1fr);
    grid-template-areas: "coach graph" "cube graph";
  }
  #cubeWrap { grid-area: cube; position: relative; min-height: 0; min-width: 0; }
  #graphWrap { grid-area: graph; position: relative; min-width: 0; min-height: 0; }
  canvas { display: block; width: 100%; height: 100%; touch-action: none; }
  .title-mode #cubeHint { opacity: 0; }
  #cubeHint {
    position: absolute; right: 12px; bottom: 6px; font-size: 11.5px; font-weight: 700; color: #a39a8d;
    pointer-events: none; transition: opacity .4s;
  }

  /* ---------- Tutorial coach ---------- */
  #coach {
    grid-area: coach; margin: 2px 12px 4px; padding: 12px 14px 12px; background: var(--card);
    border-radius: 18px; box-shadow: var(--shadow); display: none;
  }
  #coach.show { display: block; animation: pop .28s ease-out; }
  #stage.landscape #coach { margin: 4px 8px 4px 12px; max-width: 460px; }
  .coach-head { display: flex; align-items: center; gap: 8px; margin-bottom: 4px; }
  .coach-step { flex: none; font-size: 11px; font-weight: 800; letter-spacing: .08em; color: var(--accent); background: var(--accent-soft); padding: 3px 8px; border-radius: 99px; }
  .coach-title { font-weight: 800; font-size: 16.5px; }
  #coachText { margin: 0; font-size: 14.5px; line-height: 1.38; color: #3d372f; }
  #coachText b { color: var(--ink); }
  #coach.success .coach-step { background: #dff3e6; color: var(--good); }
  .coach-actions { display: flex; gap: 8px; justify-content: flex-end; margin-top: 10px; }
  .coach-actions:empty { display: none; }

  /* ---------- Buttons ---------- */
  .btn {
    border: 0; border-radius: 16px; padding: 12px 18px; font-weight: 800; font-size: 16px;
    display: inline-flex; align-items: center; justify-content: center; gap: 8px; text-decoration: none;
    transition: transform .12s ease, box-shadow .2s ease, background .2s ease;
  }
  .btn:active { transform: scale(.97); }
  .btn.primary { background: var(--ink); color: #fff; box-shadow: 0 8px 18px rgba(38,34,31,.24); }
  .btn.accent { background: var(--accent); color: #fff; box-shadow: 0 8px 18px rgba(108,71,255,.28); }
  .btn.ghost { background: transparent; color: var(--ink); box-shadow: inset 0 0 0 2px var(--line); }
  .btn.big { width: 100%; min-height: 58px; font-size: 19px; border-radius: 18px; }
  .btn.small { padding: 9px 15px; font-size: 14.5px; border-radius: 12px; min-height: 42px; }
  .btn svg { width: 20px; height: 20px; fill: currentColor; }

  /* ---------- Overlays ---------- */
  .overlay {
    position: absolute; inset: 0; z-index: 20; display: flex; flex-direction: column; align-items: center; justify-content: center;
    padding: calc(14px + env(safe-area-inset-top)) 16px calc(14px + env(safe-area-inset-bottom));
    background: rgba(244, 241, 234, .72);
    -webkit-backdrop-filter: blur(2.5px); backdrop-filter: blur(2.5px);
    transition: opacity .25s ease, visibility .25s; overflow-y: auto;
  }
  .overlay.hidden { opacity: 0; visibility: hidden; pointer-events: none; }
  .card {
    width: 100%; max-width: 400px; background: var(--card); border-radius: 26px; box-shadow: var(--shadow);
    padding: 22px 20px 18px; text-align: center; margin: auto 0;
  }
  .overlay:not(.hidden) .card { animation: pop .3s ease-out; }
  @keyframes pop { from { transform: translateY(10px) scale(.97); opacity: 0; } to { transform: none; opacity: 1; } }

  /* Title: the live cube spins above the menu card */
  #titleScreen { justify-content: flex-end; -webkit-backdrop-filter: none; backdrop-filter: none; background: none; }
  #stage.landscape ~ #titleScreen { justify-content: center; background: rgba(244, 241, 234, .6); }
  .title-card { padding-top: 18px; margin: 0; }
  .brand { display: flex; align-items: center; justify-content: center; gap: 10px; }
  .logo { width: 52px; height: auto; flex: none; }
  .title-card h1 { margin: 0; font-size: 40px; font-weight: 900; letter-spacing: -.025em; line-height: 1; }
  .tagline { margin: 8px auto 16px; max-width: 310px; color: var(--muted); font-size: 15px; line-height: 1.38; font-weight: 600; }
  .diff { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; margin-top: 12px; }
  .diff button {
    border: 0; background: var(--chip); border-radius: 13px; padding: 7px 2px; min-height: 50px;
    font-weight: 800; font-size: 14px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1px;
    transition: background .15s, color .15s, transform .12s;
  }
  .diff button:active { transform: scale(.95); }
  .diff button small { font-size: 11px; font-weight: 700; color: var(--muted); }
  .diff button[aria-checked="true"] { background: var(--ink); color: #fff; }
  .diff button[aria-checked="true"] small { color: #d4ccbf; }
  .best-line { font-size: 13.5px; color: var(--muted); font-weight: 700; min-height: 18px; margin: 9px 0 12px; font-variant-numeric: tabular-nums; }
  .best-line b { color: var(--ink); }
  .badge { font-size: 11.5px; font-weight: 800; color: #fff; background: var(--accent); padding: 3px 8px; border-radius: 99px; letter-spacing: .02em; }
  .title-foot { display: flex; justify-content: center; gap: 16px; margin-top: 8px; font-size: 13.5px; font-weight: 700; }
  .title-foot a, .title-foot button { color: var(--muted); text-decoration: none; background: none; border: 0; padding: 6px 4px; }

  /* Results */
  .result-kicker { font-weight: 900; font-size: 14px; letter-spacing: .16em; text-transform: uppercase; color: var(--good); }
  .result-time { font-size: 60px; font-weight: 900; font-variant-numeric: tabular-nums; letter-spacing: -.02em; line-height: 1.05; margin: 6px 0 2px; }
  .result-caption { font-size: 12px; font-weight: 800; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
  .result-meta { color: var(--muted); font-weight: 700; font-size: 15px; margin-top: 8px; }
  .result-best { margin: 14px 0 16px; font-weight: 800; font-size: 14.5px; background: #f1ecdf; border-radius: 12px; padding: 9px 10px; font-variant-numeric: tabular-nums; }
  .result-best.new { background: #fff1bf; color: #7a5200; }
  .stack { display: grid; gap: 10px; }

  /* Confirm */
  .confirm-card h2 { margin: 4px 0 6px; font-size: 22px; }
  .confirm-card p { margin: 0 0 16px; color: var(--muted); font-weight: 600; }

  /* Toast */
  #toast {
    position: absolute; left: 50%; top: 6px; z-index: 12; transform: translate(-50%, -6px);
    background: var(--ink); color: #fff; padding: 9px 15px; border-radius: 99px; font-size: 14px; font-weight: 700;
    opacity: 0; pointer-events: none; transition: opacity .2s ease, transform .2s ease;
    width: max-content; max-width: calc(100% - 32px); text-align: center; line-height: 1.3;
    box-shadow: 0 8px 20px rgba(38,34,31,.22);
  }
  #toast.show { opacity: 1; transform: translate(-50%, 0); }

  @media (max-height: 560px) {
    .logo { width: 40px; }
    .title-card h1 { font-size: 32px; }
    .tagline { margin-bottom: 10px; font-size: 14px; }
    .btn.big { min-height: 50px; font-size: 17px; }
    .result-time { font-size: 46px; }
    .card { padding: 14px 16px 12px; }
    .best-line { margin: 7px 0 8px; }
  }
  @media (max-height: 460px) {
    .tagline { display: none; }
    .brand { margin-bottom: 10px; }
  }
  @media (max-width: 350px) {
    .diff button { font-size: 12.5px; }
    .title-card h1 { font-size: 36px; }
  }
  @media (prefers-reduced-motion: reduce) {
    .overlay:not(.hidden) .card, #coach.show { animation: none; }
  }
</style>
</head>
<body>
<div id="app">
  <header id="hud" class="off">
    <button id="btnHome" class="icon-btn" aria-label="Back to the menu">
      <svg viewBox="0 0 24 24"><path d="M3.5 11.2 12 4l8.5 7.2"/><path d="M6 9.6V20h12V9.6"/></svg>
    </button>
    <div class="hud-mid">
      <div id="timer" class="idle">0:00.00</div>
      <div id="hudSub">&nbsp;</div>
    </div>
    <button id="btnUndo" class="icon-btn" aria-label="Undo last turn" disabled>
      <svg viewBox="0 0 24 24"><path d="M9 14 4 9l5-5"/><path d="M4 9h10.5a5.5 5.5 0 0 1 0 11H11"/></svg>
    </button>
    <button id="btnSound" class="icon-btn" aria-label="Mute sound">
      <svg viewBox="0 0 24 24"><path d="M4 9.5v5h3.5L12 18V6L7.5 9.5z"/><path class="wave" d="M15.5 9a4 4 0 0 1 0 6"/><path class="wave" d="M18 6.5a7.5 7.5 0 0 1 0 11"/><path class="mute" d="m16 9.5 5 5m0-5-5 5" hidden/></svg>
    </button>

  <main id="stage">
    <aside id="coach" aria-live="polite">
      <div class="coach-head"><span class="coach-step" id="coachStep">1 / 7</span><span class="coach-title" id="coachTitle"></span></div>
      <p id="coachText"></p>
      <div class="coach-actions" id="coachActions"></div>
    </aside>
    <div id="cubeWrap">
      <canvas id="cubeCanvas" aria-label="3D cube. Drag to look around it; double-tap to reset the view."></canvas>
      <div id="cubeHint">drag to look around</div>
    </div>
    <div id="graphWrap">
      <canvas id="graphCanvas" aria-label="The cube unrolled into rings. Swipe a dot along a ring to turn that layer."></canvas>
      <div id="toast" role="status"></div>
    </div>
  </main>

  <!-- Start screen -->
  <section id="titleScreen" class="overlay">
    <div class="card title-card" id="titleCard">
      <div class="brand">
      <svg class="logo" viewBox="-1.62 -1.72 3.24 3.14" aria-hidden="true">
        <g fill="none" stroke="#c4bcae" stroke-width=".075">
          <circle cx=".5" cy=".2887" r="1"/><circle cx="0" cy="-.5774" r="1"/><circle cx="-.5" cy=".2887" r="1"/>
        </g>
        <g stroke="#2b2724" stroke-width=".055">
          <circle cx="0" cy="-.5774" r=".2" fill="#fbfaf5"/><circle cx="-.5" cy=".2887" r=".2" fill="#1f8a4a"/>
          <circle cx=".5" cy=".2887" r=".2" fill="#d9372b"/><circle cx="0" cy="1.1547" r=".2" fill="#f7c11e"/>
          <circle cx="-1" cy="-.5774" r=".2" fill="#f28322"/><circle cx="1" cy="-.5774" r=".2" fill="#1f4ec2"/>
        </g>
      </svg>
      <h1>Cube Rings</h1>
      </div>
      <p class="tagline">A Rubik's cube unrolled into nine rings. Swipe the dots to turn it.</p>
      <button id="btnTimed" class="btn primary big">
        <svg viewBox="0 0 24 24"><path d="M8 5.5v13l10.5-6.5z"/></svg> Timed Mode
      </button>
      <div class="diff" role="radiogroup" aria-label="Scramble difficulty">
        <button role="radio" data-diff="easy" aria-checked="true">Easy<small>2 turns</small></button>
        <button role="radio" data-diff="medium" aria-checked="false">Medium<small>4 turns</small></button>
        <button role="radio" data-diff="hard" aria-checked="false">Hard<small>7 turns</small></button>
        <button role="radio" data-diff="expert" aria-checked="false">Expert<small>20 turns</small></button>
      </div>
      <div class="best-line" id="bestLine">&nbsp;</div>
      <button id="btnTutorial" class="btn ghost big">
        <svg viewBox="0 0 24 24"><path d="M12 3.2 1.8 8.4 12 13.6l8.2-4.2V15h2V8.4z"/><path d="M5.5 12.2v3.9c0 1.5 3 3.2 6.5 3.2s6.5-1.7 6.5-3.2v-3.9L12 15.5z"/></svg> Tutorial <span class="badge" id="newHere">start here</span>
      </button>
      <div class="title-foot">
        <a href="index.html">&larr; All games</a>
        <button id="btnTitleSound" type="button">Sound: on</button>
      </div>
    </div>
  </section>

  <!-- Finish screen -->
  <section id="resultScreen" class="overlay hidden" aria-live="polite">
    <div class="card">
      <div class="result-kicker">Solved!</div>
      <div class="result-time" id="resTime">0:00.00</div>
      <div class="result-caption">finishing time</div>
      <div class="result-meta" id="resMeta"></div>
      <div class="result-best" id="resBest"></div>
      <div class="stack">
        <button id="btnAgain" class="btn primary big">Play again?</button>
        <button id="btnResMenu" class="btn ghost">Menu</button>
      </div>
    </div>
  </section>

  <!-- Leave mid-solve -->
  <section id="confirmScreen" class="overlay hidden">
    <div class="card confirm-card">
      <h2>Leave this solve?</h2>
      <p>Your clock is running. Leaving ends this attempt.</p>
      <div class="stack">
        <button id="btnStay" class="btn primary big">Keep solving</button>
        <button id="btnLeave" class="btn ghost">Leave to menu</button>
      </div>
    </div>
  </section>
</div>

<script>
(() => {
'use strict';

// ===========================================================================
// Helpers
// ===========================================================================
const TAU = Math.PI * 2;
const SQ3 = Math.sqrt(3);
const clamp = (v, lo, hi) => (v < lo ? lo : v > hi ? hi : v);
const easeOutCubic = (t) => 1 - Math.pow(1 - t, 3);
const easeInOutCubic = (t) => (t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2);
const wrapPi = (a) => { a = (a + Math.PI) % TAU; if (a < 0) a += TAU; return a - Math.PI; };
const now = () => performance.now();
const $ = (id) => document.getElementById(id);
const hexToRgb = (h) => [1, 3, 5].map((i) => parseInt(h.slice(i, i + 2), 16));
const reduceMotion = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

// ===========================================================================
// Cube model
// Axes: 0 = x (left -> right), 1 = y (down -> up), 2 = z (back -> front).
// A sticker "slot" is a cubie position plus the face it sits on.
// ===========================================================================
const FACES = [
  { k: 1, sign: 1, name: 'U' }, { k: 1, sign: -1, name: 'D' },
  { k: 2, sign: 1, name: 'F' }, { k: 2, sign: -1, name: 'B' },
  { k: 0, sign: 1, name: 'R' }, { k: 0, sign: -1, name: 'L' },
];
//                 U white    D yellow   F green    B blue     R red      L orange
const FACE_HEX = ['#fbfaf5', '#f7c11e', '#1f8a4a', '#1f4ec2', '#d9372b', '#f28322'];
const FACE_RGB = FACE_HEX.map(hexToRgb);
const FACE_U = 0;

const SLOTS = [];
FACES.forEach((f, face) => {
  const a = (f.k + 1) % 3, b = (f.k + 2) % 3;
  for (let u = -1; u <= 1; u++) for (let v = -1; v <= 1; v++) {
    const p = [0, 0, 0]; p[f.k] = f.sign; p[a] = u; p[b] = v;
    SLOTS.push({ face, k: f.k, sign: f.sign, u, v, p });
  }
});
const keyOf = (p, k, sign) => p.join(',') + '/' + k + (sign > 0 ? '+' : '-');
const SLOT_AT = new Map(SLOTS.map((s, i) => [keyOf(s.p, s.k, s.sign), i]));
const slotAt = (p, k, sign) => SLOT_AT.get(keyOf(p, k, sign));

// Quarter turn of a vector about an axis; dir +1 is +90 degrees by the right-hand rule.
function quarter(axis, dir, [x, y, z]) {
  if (dir > 0) return axis === 0 ? [x, -z, y] : axis === 1 ? [z, y, -x] : [-y, x, z];
  return axis === 0 ? [x, z, -y] : axis === 1 ? [-z, y, x] : [y, -x, z];
}

// The nine rings are the cube's nine layers: ring id = axis * 3 + (layer + 1).
const ringId = (axis, layer) => axis * 3 + layer + 1;
const ringAxis = (r) => (r / 3) | 0;
const ringLayer = (r) => (r % 3) - 1;
const pIdx = (r, dir) => r * 2 + (dir > 0 ? 1 : 0);

const PERMS = [];
for (let r = 0; r < 9; r++) for (const dir of [-1, 1]) {
  const axis = ringAxis(r), layer = ringLayer(r), perm = new Int8Array(54);
  SLOTS.forEach((s, i) => {
    if (s.p[axis] !== layer) { perm[i] = i; return; }
    const n = [0, 0, 0]; n[s.k] = s.sign;
    const p2 = quarter(axis, dir, s.p), n2 = quarter(axis, dir, n);
    const k2 = n2[0] ? 0 : n2[1] ? 1 : 2;
    perm[i] = slotAt(p2, k2, n2[k2]);
  });
  PERMS[pIdx(r, dir)] = perm;
}
function applyMove(st, r, dir) {
  const perm = PERMS[pIdx(r, dir)], out = new Uint8Array(54);
  for (let i = 0; i < 54; i++) out[perm[i]] = st[i];
  return out;
}
const solvedState = () => Uint8Array.from(SLOTS, (s) => s.face);
function isSolved(st) {
  for (let f = 0; f < 6; f++) {
    const c = st[f * 9];
    for (let i = 1; i < 9; i++) if (st[f * 9 + i] !== c) return false;
  }
  return true;
}

// ===========================================================================
// The ring graph
// Three families of three concentric rings, centered on the corners of a unit
// equilateral triangle. The family centered on the white face holds the top,
// middle and bottom layers; each sticker sits where two rings cross, and each
// face is the 3x3 patch where two families meet.
// ===========================================================================
const GAP = 0.225;
const CENTERS = [
  { x: 0.5, y: 0.5 / SQ3 },   // x-family, around the red (right) face
  { x: 0, y: -1 / SQ3 },      // y-family, around the white (top) face
  { x: -0.5, y: 0.5 / SQ3 },  // z-family, around the green (front) face
];
const radiusFor = (axis, coord) => 1 - GAP * coord;

function clusterPoint(k, sign) {

    const glow = hl.rings.has(r) || (hl.hint && hl.hint.r === r);
    if (glow && !(vm && vm.r === r)) {
      ctx.beginPath(); ctx.arc(X, Y, rad, 0, TAU);
      ctx.lineWidth = lw * 7; ctx.strokeStyle = `rgba(108,71,255,${0.08 + 0.12 * pulse})`; ctx.stroke();
    }
    ctx.beginPath(); ctx.arc(X, Y, rad, 0, TAU);
    if (r === reject) { ctx.lineWidth = lw * 2.2; ctx.strokeStyle = '#e0452f'; }

  const moving = vm ? PATHS[pIdx(vm.r, vm.dir)] : null;

  const olw = Math.max(1.15, R * 0.15);

    if (movingAt && movingAt[s]) continue;

  }
  if (moving) {
    for (const e of moving) {

      drawDot(ctx, gv.ox + TMP.x * sc, gv.oy + TMP.y * sc, R, FACE_RGB[G.state[e.slot]], olw);
    }

    ctx.strokeStyle = `rgba(108,71,255,${0.55 + 0.45 * pulse})`;

    ctx.beginPath(); ctx.arc(TMP.x, TMP.y, R * 1.55, 0, TAU);
    ctx.fillStyle = 'rgba(255,255,255,0.55)'; ctx.fill();
    ctx.lineWidth = Math.max(2, R * 0.22); ctx.strokeStyle = '#26221f'; ctx.stroke();

    ctx.translate(c.x, c.y); ctx.rotate(c.rot);

    ctx.restore();
  }
}

function burstConfetti() {

    const s = (Math.random() * 54) | 0;
    const x = gv.ox + DOTS[s].x * gv.sc, y = gv.oy + DOTS[s].y * gv.sc;
    const a = Math.random() * TAU, sp = 120 + Math.random() * 420;

// ===========================================================================
// Turn animation
// ===========================================================================
function visualMove() {

}
function stepAnim(tms) {

// Complete a player-driven animation at once (so a new swipe or undo never waits on the last one).
function settle() {

}
function runSequence(moves, onDone, kind) {

function makeScramble(n) {
  for (let attempt = 0; attempt < 40; attempt++) {
    const seq = [];
    let lastAxis = -1;
    while (seq.length < n) {
      const r = (Math.random() * 9) | 0;
      if (ringAxis(r) === lastAxis) continue; // never twice on one axis in a row, so nothing cancels
      seq.push({ r, dir: Math.random() < 0.5 ? 1 : -1 });
      lastAxis = ringAxis(r);

    let st = solvedState();

}
// The quickest known way back: undo the net sequence (scramble + player turns) from the end.
function nextHintMove() {
  const stack = [];

    const top = stack[stack.length - 1], below = stack[stack.length - 2];
    if (top && top.r === m.r && top.dir === -m.dir) { stack.pop(); continue; }
    if (top && below && top.r === m.r && below.r === m.r && top.dir === m.dir && below.dir === m.dir) {
      stack.pop(); stack.pop(); stack.push({ r: m.r, dir: -m.dir }); continue;

  }

// ===========================================================================
// Swiping the graph
// ===========================================================================
const drag = { active: false, id: -1, slot: -1, sx: 0, sy: 0, ring: -1, cx: 0, cy: 0, radPx: 1, prevAng: 0, acc: 0, samples: [], live: null };

  return { x: e.clientX - rect.left, y: e.clientY - rect.top };
}
function nearestDot(x, y) {
  let best = -1, bd = Infinity;

    const dx = gv.ox + DOTS[i].x * gv.sc - x, dy = gv.oy + DOTS[i].y * gv.sc - y, d = dx * dx + dy * dy;

function inputOpen() {

  if (G.mode === 'timed') return G.phase === 'ready' || G.phase === 'running';
  if (G.mode === 'tutorial') return Tut.acceptsInput();
  return false;
}
function ringAllowed(r) {

graphCanvas.addEventListener('pointerdown', (e) => {
  Sound.unlock();

  if (e.pointerType === 'mouse' && e.button !== 0) return;

  if (!inputOpen()) {
    if (G.mode === 'tutorial' && Tut.step && Tut.step.info) toast('Tap Next to continue');
    return;
  }
  const pt = graphPoint(e);
  const s = nearestDot(pt.x, pt.y);
  if (s < 0) return;
  e.preventDefault();
  try { graphCanvas.setPointerCapture(e.pointerId); } catch (err) { /* ignore */ }
  Object.assign(drag, { active: true, id: e.pointerId, slot: s, sx: pt.x, sy: pt.y, ring: -1, acc: 0, samples: [], live: null });
  dirty = true;
});
graphCanvas.addEventListener('pointermove', (e) => {
  if (!drag.active || e.pointerId !== drag.id) return;
  const pt = graphPoint(e);

    const dx = pt.x - drag.sx, dy = pt.y - drag.sy;
    if (Math.hypot(dx, dy) < LOCK_PX) return;
    // The dot sits on two rings; the swipe direction picks the one it runs along.
    const [ra, rb] = SLOT_RINGS[drag.slot];
    const alignOn = (r) => { const a = angleOn(r, DOTS[drag.slot]); return Math.abs(dx * -Math.sin(a) + dy * Math.cos(a)); };
    const al = alignOn(ra), bl = alignOn(rb);

    // In the tutorial, give an in-between swipe to the ring being taught.
    const other = pick === ra ? rb : ra;

    const ring = RINGS[pick];

  {
    title: 'Every dot is a sticker',
    text: 'Each cluster of nine dots is one face of the cube. The <b>white cluster</b> at the top is the white face on top of the cube.',
    info: true,
    enter() { TOP_FACE.forEach((s) => { hl.dots.add(s); hl.cube.add(s); }); },
  },
  {
    title: 'Rings are layers',
    text: 'Each ring turns one layer of the cube. Put a finger on a dot and <b>swipe along the glowing ring</b>.',
    enter() {
      Tut.allow([RING_TOP]); hl.rings.add(RING_TOP);
      const dir = Math.abs(PATH_AT[pIdx(RING_TOP, 1)][TUT_DOT].da) < Math.abs(PATH_AT[pIdx(RING_TOP, -1)][TUT_DOT].da) ? 1 : -1;
      hl.hint = { r: RING_TOP, dir, slot: TUT_DOT };
    },
    check: () => G.history.length > 0,
    praise: 'The top layer turned!',
  },
  {
    title: 'Turn it back',
    text: 'The white face in the middle of that ring spun too, just like the top of the cube. <b>Swipe the ring the other way</b> to put it back.',
    enter() { Tut.allow([RING_TOP]); hl.rings.add(RING_TOP); Tut.showHint(); },
    onMove() { if (!isSolved(G.state)) Tut.showHint(); },
    check: () => isSolved(G.state),
    praise: 'Solved again!',
  },
  {
    title: 'Two rings per dot',
    text: 'Every dot sits where two rings cross, so <b>the way you swipe picks the ring</b>. Swipe the circled dot along the glowing ring.',
    enter() {
      Tut.allow([RING_RIGHT]); hl.rings.add(RING_RIGHT); hl.dots.add(TUT_DOT); hl.cube.add(TUT_DOT);
      const dir = Math.abs(PATH_AT[pIdx(RING_RIGHT, 1)][TUT_DOT].da) < Math.abs(PATH_AT[pIdx(RING_RIGHT, -1)][TUT_DOT].da) ? 1 : -1;
      hl.hint = { r: RING_RIGHT, dir, slot: TUT_DOT };
    },
    check: () => G.history.some((m) => m.r === RING_RIGHT),
    praise: 'That one turned the right side!',
  },
  {
    title: 'Fix it',
    text: 'The cube is mixed up now. <b>Make every cluster one color</b> again. Any ring works; tap Hint if you want a nudge.',
    hintButton: true,
    enter() { Tut.allow(null); },
    check: () => isSolved(G.state),
    praise: 'Nicely done!',
    celebrate: true,
  },
  {
    title: 'Your turn',
    text: 'We scrambled it with <b>two turns</b>. Solve it! Tap Hint if you get stuck, or ↶ to take a turn back.',
    hintButton: true,
    enter() {
      Tut.allow(null);
      G.history = [];
      G.scramble = makeScramble(2);
      runSequence(G.scramble.map((m, i) => ({ ...m, dur: 420, delay: i === 0 ? 500 : 180 })), () => { dirty = true; updateHud(); }, 'auto');
    },
    check: () => isSolved(G.state),
    praise: 'You solved it!',
    celebrate: true,
  },
  {
    title: 'You’re ready!',
    text: 'In <b>Timed Mode</b> the cube gets scrambled and the clock starts on your first swipe. Solve every face as fast as you can.',
    info: true,
    final: true,
  },
];

const Tut = {
  i: 0,
  step: null,
  allowed: null,
  busy: false,
  timer: 0,
  acceptsInput() { return G.mode === 'tutorial' && !!this.step && !this.step.info && !this.busy; },
  allow(list) { this.allowed = list ? new Set(list) : null; },
  rejectMessage() { return G.mode === 'tutorial' ? 'Swipe along the glowing ring' : ''; },
  showHint() {
    const m = nextHintMove();
    if (!m) { hl.hint = null; return; }
    hl.hint = { r: m.r, dir: m.dir, slot: hintSlotFor(m.r, m.dir) };
    dirty = true;
  },
  start() {
    G.mode = 'tutorial'; G.phase = 'idle';
    resetBoard();
    setOverlay(titleEl, false); setOverlay(resultEl, false); setOverlay(confirmEl, false);
    tweenViewHome(550);
    this.go(0);
  },
  go(i) {
    clearTimeout(this.timer);
    hideToast();
    this.i = i; this.step = TUTORIAL[i]; this.busy = false; this.allowed = new Set();
    hl.dots.clear(); hl.rings.clear(); hl.cube.clear(); hl.hint = null;
    coachEl.classList.remove('success');
    $('coachStep').textContent = `${i + 1} / ${TUTORIAL.length}`;
    $('coachTitle').textContent = this.step.title;
    $('coachText').innerHTML = this.step.text;
    const actions = $('coachActions');
    actions.innerHTML = '';
    const addBtn = (label, cls, fn) => { const b = document.createElement('button'); b.className = `btn small ${cls}`; b.textContent = label; b.addEventListener('click', () => { Sound.unlock(); Sound.click(); fn(); }); actions.appendChild(b); return b; };
    if (this.step.final) {
      addBtn('Menu', 'ghost', () => showTitle());
      addBtn('Play Timed Mode', 'primary', () => { save.tutorialDone = true; persist(); startTimed(G.diff); });
    } else if (this.step.info) {
      addBtn('Next', 'primary', () => this.go(this.i + 1));
    } else if (this.step.hintButton) {
      addBtn('Hint', 'ghost', () => { this.showHint(); if (!hl.hint) toast('Already solved!'); });
    }
    coachEl.classList.add('show');
    if (this.step.enter) this.step.enter();
    if (this.step.final) { save.tutorialDone = true; persist(); }
    updateHud();
    layout();
    dirty = true;
  },
  onMove() {
    const st = this.step;
    if (!st || st.info || this.busy) return;
    if (st.check && st.check()) {
      this.busy = true;
      hl.hint = null; hl.rings.clear(); hl.dots.clear(); hl.cube.clear();
      coachEl.classList.add('success');
      $('coachStep').textContent = '✓ Nice';
      $('coachText').innerHTML = `<b>${st.praise}</b>`;
      $('coachActions').innerHTML = '';
      if (st.celebrate) { burstConfetti(); Sound.solve(); }
      updateHud();
      this.timer = setTimeout(() => { if (G.mode === 'tutorial') this.go(this.i + 1); }, 1300);
    } else if (st.onMove) st.onMove();
    dirty = true;
  },
  exit() {
    clearTimeout(this.timer);
    this.step = null; this.busy = false; this.allowed = null;
    coachEl.classList.remove('show', 'success');
  },
};

// ===========================================================================
// Title screen wiring
// ===========================================================================
const diffButtons = [...document.querySelectorAll('.diff button')];
function refreshTitle() {
  diffButtons.forEach((b) => b.setAttribute('aria-checked', String(b.dataset.diff === G.diff)));
  const best = save.best[G.diff];
  $('bestLine').innerHTML = best ? `Best on ${DIFFS[G.diff].label}: <b>${fmtTime(best)}</b>` : `No ${DIFFS[G.diff].label} time yet`;
  $('newHere').hidden = !!save.tutorialDone;
  $('btnTitleSound').textContent = Sound.muted ? 'Sound: off' : 'Sound: on';
}
diffButtons.forEach((b) => b.addEventListener('click', () => {
  Sound.unlock(); Sound.click();
  G.diff = b.dataset.diff; save.diff = G.diff; persist();
  refreshTitle();
}));
$('btnTimed').addEventListener('click', () => { Sound.unlock(); Sound.click(); startTimed(G.diff); });
$('btnTutorial').addEventListener('click', () => { Sound.unlock(); Sound.click(); Tut.start(); });
$('btnAgain').addEventListener('click', () => { Sound.unlock(); Sound.click(); startTimed(G.diff); });
$('btnResMenu').addEventListener('click', () => { Sound.click(); showTitle(); });
$('btnHome').addEventListener('click', () => { Sound.unlock(); goHome(); });
$('btnStay').addEventListener('click', () => { Sound.click(); setOverlay(confirmEl, false); });
$('btnLeave').addEventListener('click', () => { Sound.click(); showTitle(); });
btnUndo.addEventListener('click', () => { Sound.unlock(); undo(); });

function setMuted(m) {
  Sound.muted = m; save.muted = m; persist();
  btnSound.setAttribute('aria-label', m ? 'Unmute sound' : 'Mute sound');
  btnSound.querySelectorAll('.wave').forEach((p) => { p.hidden = m; });
  btnSound.querySelector('.mute').hidden = !m;
  refreshTitle();
}
btnSound.addEventListener('click', () => { Sound.unlock(); setMuted(!Sound.muted); Sound.click(); });
$('btnTitleSound').addEventListener('click', () => { Sound.unlock(); setMuted(!Sound.muted); Sound.click(); });

document.addEventListener('keydown', (e) => {
  if ((e.key === 'z' || e.key === 'Z') && (e.ctrlKey || e.metaKey)) { e.preventDefault(); undo(); }
  else if (e.key === 'Backspace' && G.mode !== 'title') { e.preventDefault(); undo(); }
  else if (e.key === 'Escape') {
    if (!confirmEl.classList.contains('hidden')) setOverlay(confirmEl, false);
    else if (G.mode !== 'title') goHome();
  }
});
document.addEventListener('pointerdown', () => Sound.unlock(), { passive: true });
// Stop iOS from pinch-zooming or scrolling the page under the game.
document.addEventListener('gesturestart', (e) => e.preventDefault());
document.addEventListener('touchmove', (e) => { if (!e.target.closest('.overlay')) e.preventDefault(); }, { passive: false });

// ===========================================================================
// Main loop
// ===========================================================================
let lastT = now();
function frame(tms) {
  requestAnimationFrame(frame);
  const dt = Math.min(0.05, Math.max(0, (tms - lastT) / 1000));
  lastT = tms;
  const hadAnim = !!anim || !!drag.live;
  stepAnim(tms);
  const viewMoving = stepView(tms, dt);
  if (confetti.length) stepConfetti(dt);
  tickTimer();
  const pulsing = hl.dots.size || hl.rings.size || hl.cube.size || hl.hint || (hl.reject && tms < hl.reject.until + 50);
  if (dirty || hadAnim || anim || viewMoving || confetti.length || pulsing || drag.active || orbit.active) {
    renderCube(tms);
    renderGraph(tms);
    dirty = false;
  }
}

// ===========================================================================
// Boot
// ===========================================================================
if (typeof ResizeObserver !== 'undefined') {
  new ResizeObserver(() => { sizeCanvases(); dirty = true; }).observe(stageEl);
}
window.addEventListener('resize', layout);
window.addEventListener('orientationchange', () => setTimeout(layout, 120));
setMuted(Sound.muted);
cubeHintEl.hidden = !!save.orbited;
showTitle();
requestAnimationFrame(frame);

// A small handle for automated tests.
window.CubeRings = {
  G, SLOTS, DOTS, RINGS, PERMS, PATHS, RING_POS_DIR, SLOT_RINGS, TUT_DOT, RING_TOP, RING_RIGHT,
  applyMove, isSolved, solvedState, ringId, pIdx, facePoint, gv, view, Tut,
  dotScreen: (s) => dotScreen(s, null, { x: 0, y: 0 }),
  busy: () => !!anim || queue.length > 0 || drag.active,
  preview: (r, dir, t) => { drag.live = r == null ? null : { r, dir, t }; dirty = true; },
};
})();
</script>
</body>
</html>
