<svg viewBox="0 0 440 300" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="chromeBlue" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e8f6ff"/>
      <stop offset="0.45" stop-color="#7cc4f5"/>
      <stop offset="0.52" stop-color="#2a72c4"/>
      <stop offset="1" stop-color="#bfe6ff"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff6cf"/>
      <stop offset="0.42" stop-color="#ffd24a"/>
      <stop offset="0.55" stop-color="#d98f15"/>
      <stop offset="1" stop-color="#ffe79a"/>
    </linearGradient>
    <linearGradient id="goldBig" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fffae3"/>
      <stop offset="0.4" stop-color="#ffd84e"/>
      <stop offset="0.58" stop-color="#c47e0c"/>
      <stop offset="1" stop-color="#ffe98f"/>
    </linearGradient>
    <linearGradient id="shell" x1="0.3" y1="0" x2="0.7" y2="1">
      <stop offset="0" stop-color="#63ad7c"/>
      <stop offset="0.45" stop-color="#357d55"/>
      <stop offset="1" stop-color="#1b4030"/>
    </linearGradient>
    <linearGradient id="visorGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#9ff0ff"/>
      <stop offset="0.5" stop-color="#3fd8ff"/>
      <stop offset="1" stop-color="#7fe6ff"/>
    </linearGradient>
    <linearGradient id="ringGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#9fe0ff"/>
      <stop offset="0.5" stop-color="#2f7fd0"/>
      <stop offset="1" stop-color="#8ad4ff"/>
    </linearGradient>
    <linearGradient id="plateGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a4a63"/>
      <stop offset="1" stop-color="#141c2c"/>
    </linearGradient>
    <radialGradient id="ringGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0.55" stop-color="#0a1830" stop-opacity="0"/>
      <stop offset="0.85" stop-color="#1d8fe0" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#1d8fe0" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <ellipse cx="220" cy="132" rx="116" ry="96" fill="url(#ringGlow)"/>

  <!-- arena ring, back half -->
  <path d="M122 150 A98 40 0 0 1 318 150" fill="none" stroke="#0a1422" stroke-width="13"/>
  <path d="M122 150 A98 40 0 0 1 318 150" fill="none" stroke="url(#ringGrad)" stroke-width="7"/>
  <path d="M122 150 A98 40 0 0 1 318 150" fill="none" stroke="#dff3ff" stroke-width="1.5" stroke-opacity="0.8"/>

  <!-- the blob knight, standing in the ring -->
  <g transform="translate(220,105) scale(2.0) translate(-54,-47)">
    <path d="M24 60 q-5 3 -4 8 q1 5 7 5 q6 0 7-5 q1-5 -4-8 z" fill="url(#shell)" stroke="#0d2117" stroke-width="1.6" stroke-linejoin="round"/>
    <path d="M21 67 h13" stroke="url(#goldGrad)" stroke-width="2" stroke-linecap="round"/>
    <path d="M84 60 q5 3 4 8 q-1 5 -7 5 q-6 0 -7-5 q-1-5 4-8 z" fill="url(#shell)" stroke="#0d2117" stroke-width="1.6" stroke-linejoin="round"/>
    <path d="M74 67 h13" stroke="url(#goldGrad)" stroke-width="2" stroke-linecap="round"/>
    <path d="M40 30 q-4-9 2-14 q1 8 6 11 z" fill="url(#goldBig)" stroke="#5a3402" stroke-width="1.1" stroke-linejoin="round"/>
    <path d="M68 30 q4-9 -2-14 q-1 8 -6 11 z" fill="url(#goldBig)" stroke="#5a3402" stroke-width="1.1" stroke-linejoin="round"/>
    <path d="M54 24 c13 0 21.5 11 21.5 24 c0 13 -9 21.5 -21.5 21.5 c-12.5 0 -21.5 -8.5 -21.5 -21.5 c0 -13 8.5 -24 21.5 -24 z"
          fill="url(#shell)" stroke="#0d2117" stroke-width="2.2" stroke-linejoin="round"/>
    <path d="M40 33 q14 -8 28 0 q-14 -3 -28 0 z" fill="#ffffff" opacity="0.18"/>
    <path d="M34 40 q20 -7 40 0" fill="none" stroke="url(#goldBig)" stroke-width="3.4" stroke-linecap="round"/>
    <path d="M54 46 v22" fill="none" stroke="url(#goldGrad)" stroke-width="2" stroke-opacity="0.75" stroke-linecap="round"/>
    <path d="M38 48 q16 -6 32 0 q-16 9 -32 0 z" fill="url(#visorGrad)" stroke="#0d2117" stroke-width="1.4" stroke-linejoin="round"/>
  </g>

  <!-- arena ring, front half, crossing the knight's base -->
  <path d="M122 150 A98 40 0 0 0 318 150" fill="none" stroke="#0a1422" stroke-width="13"/>
  <path d="M122 150 A98 40 0 0 0 318 150" fill="none" stroke="url(#ringGrad)" stroke-width="7"/>
  <path d="M122 150 A98 40 0 0 0 318 150" fill="none" stroke="#dff3ff" stroke-width="1.5" stroke-opacity="0.8"/>
  <ellipse cx="220" cy="150" rx="84" ry="33" fill="none" stroke="#0e2238" stroke-width="2" stroke-opacity="0.5"/>

  <text x="220" y="56" text-anchor="middle" font-family="Impact, sans-serif" font-size="36" letter-spacing="3" fill="#06101e" transform="translate(2,2)">BLOB KNIGHT</text>
  <text x="220" y="56" text-anchor="middle" font-family="Impact, sans-serif" font-size="36" letter-spacing="3" fill="url(#chromeBlue)" stroke="#0a2b52" stroke-width="2" paint-order="stroke">BLOB KNIGHT</text>

  <text x="221" y="223" text-anchor="middle" font-family="Impact, sans-serif" font-size="76" letter-spacing="1" fill="#06101e" transform="translate(3,3)">RUMPLER</text>
  <text x="220" y="222" text-anchor="middle" font-family="Impact, sans-serif" font-size="76" letter-spacing="1" fill="url(#goldGrad)" stroke="#3d2400" stroke-width="3" paint-order="stroke">RUMPLER</text>
  <text x="220" y="222" text-anchor="middle" font-family="Impact, sans-serif" font-size="76" letter-spacing="1" fill="none" stroke="#fff7d8" stroke-width="0.8" stroke-opacity="0.55">RUMPLER</text>

  <g>
    <rect x="148" y="240" width="144" height="34" rx="6" fill="url(#plateGrad)" stroke="#7fd0ff" stroke-width="2"/>
    <rect x="152" y="244" width="136" height="3" rx="1.5" fill="#bfe6ff" opacity="0.5"/>
    <text x="220" y="266" text-anchor="middle" font-family="Impact, sans-serif" font-size="29" letter-spacing="9" fill="url(#chromeBlue)" stroke="#0a2b52" stroke-width="1" paint-order="stroke">ARENA</text>
  </g>
</svg>
