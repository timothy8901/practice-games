<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Blob Knight Rumbler</title>
<!-- The game's name was misspelled "Rumpler" until 2026-10-03, when the page moved
     to blob-knight-rumbler.html. This is only here so old bookmarks and links still
     land on the game; nothing in the site points at this address. It is not the
     game (it has no `const ABIL = {`), so the Android build can never pick it up. -->
<link rel="canonical" href="blob-knight-rumbler.html">
<meta name="robots" content="noindex">
<meta http-equiv="refresh" content="0; url=blob-knight-rumbler.html">
<style>
  :root {
    --bg: #1a1a2e;
    --text: #f0f0f5;
    --muted: #9090a8;
    --accent: #ffd54d;
  }
  html, body { height: 100%; }
  body {
    margin: 0;
    display: flex; align-items: center; justify-content: center;
    background: var(--bg); color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    text-align: center; padding: 24px;
  }
  .card {
    background: linear-gradient(160deg, #30304a 0%, #1a1a2e 100%);
    border: 2px solid #4a4a66; border-radius: 16px;
    padding: 28px 32px; max-width: 420px;
    box-shadow: 0 18px 50px rgba(0,0,0,0.6), inset 0 1px 0 rgba(255,255,255,0.06);
  }
  h1 { font-size: 1.15rem; font-weight: 800; letter-spacing: 0.04em; margin: 0 0 10px; }
  h1 strong { color: var(--accent); }
  p { color: var(--muted); font-size: 0.9rem; line-height: 1.5; margin: 0 0 18px; }
  a.go {
    display: inline-block; text-decoration: none;
    background: var(--accent); color: #2b2b40;
    border-radius: 8px; padding: 11px 22px;
    font-weight: 800; letter-spacing: 0.04em;
  }
  a.go:hover { background: #fff5a0; }
  .small { display: block; margin-top: 14px; font-size: 0.72rem; color: var(--muted); }
  .small a { color: var(--muted); }
</style>
</head>
<body>
  <div class="card">
    <h1><strong>Blob Knight Rumbler</strong> has a new address</h1>
    <p>Same game, spelled right. Taking you there now.</p>
    <a class="go" href="blob-knight-rumbler.html">Play Blob Knight Rumbler &rarr;</a>
    <span class="small">Or head back to <a href="index.html">all the games</a>.</span>
  </div>
<script>
  // Go immediately, carrying any query string or hash, and replace this page in
  // history so Back returns where the visitor came from rather than bouncing here.
  try {
    location.replace('blob-knight-rumbler.html' + location.search + location.hash);
  } catch (_) { /* the meta refresh and the link above still work */ }
</script>
</body>
</html>
