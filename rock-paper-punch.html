/* ================================= MATH =================================== */
const TAU=Math.PI*2;
function clamp(v,a,b){ return v<a?a:v>b?b:v; }
function lerp(a,b,t){ return a+(b-a)*t; }
function dist2(ax,ay,bx,by){ const dx=ax-bx,dy=ay-by; return dx*dx+dy*dy; }
let _seed=12345;
function srand(){ _seed=(_seed*1103515245+12345)&0x7fffffff; return _seed/0x7fffffff; }
function srange(a,b){ return a+(b-a)*srand(); }
function pick(a){ return a[(srand()*a.length)|0]; }
function hash2(i,j){ let h=(i*374761393+j*668265263)|0; h=(h^(h>>13))*1274126177; return ((h^(h>>16))>>>0)/4294967295; }
const ROMAN=['','I','II','III','IV','V','VI','VII','VIII','IX','X'];
function roman(n){ return ROMAN[n]||('+'+n); }

/* ================================= STATE ================================== */
const cv=document.getElementById('cv'), ctx=cv.getContext('2d');
let DPR=1, VW=0, VH=0;
let SAFE={l:0,r:0,b:0,t:0};
function readSafeArea(){
  try{
    const d=document.createElement('div');
    d.style.cssText='position:fixed;left:0;top:0;width:0;height:0;visibility:hidden;'+
      'padding-left:env(safe-area-inset-left);padding-right:env(safe-area-inset-right);'+
      'padding-bottom:env(safe-area-inset-bottom);padding-top:env(safe-area-inset-top);';
    document.body.appendChild(d); const cs=getComputedStyle(d);
    SAFE={l:parseFloat(cs.paddingLeft)||0, r:parseFloat(cs.paddingRight)||0,
          b:parseFloat(cs.paddingBottom)||0, t:parseFloat(cs.paddingTop)||0};
    d.remove();
  }catch(e){ SAFE={l:0,r:0,b:0,t:0}; }
}
function resize(){
  DPR=Math.min(2, window.devicePixelRatio||1);       // re-sampled on every resize
  VW=window.innerWidth; VH=window.innerHeight;
  cv.width=Math.floor(VW*DPR); cv.height=Math.floor(VH*DPR);
  cv.style.width=VW+'px'; cv.style.height=VH+'px';
  readSafeArea();
}
window.addEventListener('resize',resize);
window.addEventListener('orientationchange',()=>{ try{ clearInput(); }catch(e){} setTimeout(resize,120); });
resize();

let UI={ mode:'menu', hover:null };
let RDT=1/60;               // real frame delta for presentation-only timers
function blocked(){ return VH>VW; }          // portrait is a HARD modal, not just a painted card
function clearInput(){ touches.clear(); for(const k in keys) keys[k]=false; }
let G=null;
let buttons=[];
let overBtn=null;
let _uid=1;
let BEST=0;                       // session-only high score (no localStorage in this collection)

/* presentation zoom: keeps logic in world units but makes the fighters read big on a phone */
function zoomLevel(){ return clamp(Math.min(VW,VH)/231, 1.35, 2.6); }
function viewW(){ return VW/zoomLevel(); }      // visible world width
function groundY(){ return (VH*0.62)/zoomLevel(); }   // world units; kept above the touch controls

/* ------- progression: x1.35 tier math, fractional exponent ------- */
function rankOf(level){ return 1+Math.floor((level-1)/LVL_PER_RANK); }
function growOf(level){ return Math.pow(TIER_MULT,(level-1)/LVL_PER_RANK); }
function xpFor(level){ return Math.round(XP_BASE*Math.pow(level,XP_POW)); }
function rankName(cls,level){
  const rk=rankOf(level), base=NAMES[cls].melee[Math.min(rk,4)-1];
  return rk>4 ? base+' '+roman(Math.min(rk-3,10)) : base;
}
function applyLevel(p){
  const c=CLASSES[p.cls], g=growOf(G.level), rk=Math.min(rankOf(G.level),4);
  const frac = p.maxHp>0 ? p.hp/p.maxHp : 1;
  p.maxHp=c.hp*g; p.atk=c.atk*g;
  p.hp=clamp(p.maxHp*frac,1,p.maxHp);
  p.r=c.radius*(1+(rk-1)*0.13);      // visible size bump per rank
  p.tier=rk;
}

/* ================================ ENTITIES ================================ */
function makePlayer(cls){
  const c=CLASSES[cls];
  const p={ id:_uid++, cls, army:cls, role:'melee', tier:1,
    x:220, y:0, vx:0, vy:0, r:c.radius, face:1, anim:0, atkAnim:0, hurt:0,
    hp:c.hp, maxHp:c.hp, atk:c.atk, dead:false, sel:false,
    grounded:true, state:'idle', stateT:0, iframes:0, duckCd:0, atkTimer:0,
    hitList:[], atkKind:null, blink:0 };
  p.y=groundY()-p.r;
  return p;
}
function makeEnemy(cls, role, x, level){
  const A=E_ARCH[cls], R=E_ROLE[role];
  const g=Math.pow(TIER_MULT,(level-1)/LVL_PER_RANK), rk=Math.min(rankOf(level),4);
  const hp=R.hp*A.hp*g;
  const e={ id:_uid++, army:cls, role, tier:rk,
    x, y:0, vx:0, vy:0, r:R.radius*(1+(rk-1)*0.10), face:-1, anim:srand()*TAU, atkAnim:0, hurt:0,
    hp, maxHp:hp, atk:R.atk*A.atk*g, speed:R.speed*A.spd, reach:R.reach, atkCd:R.atkCd,
    thrower:R.thrower, level, dead:false, sel:false, grounded:true,
    st:'approach', stT:0, atkTimer:srange(0,0.7), staggerT:0.25,
    xpValue:Math.round(9*level*(role==='siege'?1.7:role==='ranged'?1.25:1)) };
  e.y=groundY()-e.r;
  return e;
}

function startRun(cls){
  clearInput();
  _seed=((performance.now()*7919)|0)^0x9e3779b9;
  G={ cls, player:null, enemies:[], projectiles:[], pickups:[], props:[], particles:[], floats:[],
      camX:0, shakeT:0, shakeMag:0, hitstop:0,
      dist:0, score:0, kills:0, combo:0, comboBest:0, comboT:0,
      lives:LIVES_START, level:1, xp:0, xpNext:xpFor(1),
      time:0, result:null, msg:null, msgT:0, overT:0,
      waveT:1.4, chunks:new Set(), sky:new Set(), skyProps:[] };
  G.player=makePlayer(cls);
  applyLevel(G.player); G.player.hp=G.player.maxHp;
  ensureChunks(); ensureSky();
  UI.mode='play';
  flash(CLASSES[cls].label+'  —  '+CLASSES[cls].title);
  Audio.resumeOnGesture();
}
function flash(t){ G.msg=t; G.msgT=2.4; }

/* ========================= PROCEDURAL WORLD (endless) ===================== */
function ensureChunks(){
  const c0=Math.floor((G.camX-CHUNK_W)/CHUNK_W), c1=Math.floor((G.camX+viewW()+CHUNK_W*2)/CHUNK_W);
  for(let ci=c0; ci<=c1; ci++){ if(G.chunks.has(ci)) continue; G.chunks.add(ci); genChunk(ci); }
  const cut=G.camX-CHUNK_W*1.6;
  if(G.props.length>260) G.props=G.props.filter(p=>p.x>cut);
  G.pickups=G.pickups.filter(p=>p.x>cut);
}
function genChunk(ci){
  if(ci<0) return;
  const bx=ci*CHUNK_W, h=k=>hash2(ci*31+k, 17);
  const n=2+Math.floor(h(1)*4);                             // foreground props
  for(let i=0;i<n;i++){ const t=h(10+i);
    G.props.push({ layer:0, x:bx+40+t*(CHUNK_W-80), kind: t<0.34?'lamp': t<0.70?'crate':'bollard',
      s:0.85+h(20+i)*0.6, seed:h(70+i) }); }
  if(h(3)>0.60) G.pickups.push({ x:bx+180+h(4)*(CHUNK_W-360), yOff:-30, kind:'health', bob:h(5)*TAU });
}
/* the skyline lives in parallax space (camX*0.38) so it streams and prunes in ITS OWN coords */
function genSky(si){
  if(si<0) return;
  const bx=si*CHUNK_W, h=k=>hash2(si*31+k, 91);
  const nb=3+Math.floor(h(2)*4);
  for(let i=0;i<nb;i++) G.skyProps.push({ x:bx+h(30+i)*CHUNK_W, w:120+h(40+i)*190, hh:130+h(50+i)*230 });
}
function ensureSky(){
  const px=G.camX*0.38, vw=viewW();
  const c0=Math.floor((px-CHUNK_W)/CHUNK_W), c1=Math.floor((px+vw+CHUNK_W)/CHUNK_W);
  for(let si=c0; si<=c1; si++){ if(G.sky.has(si)) continue; G.sky.add(si); genSky(si); }
  const cut=px-CHUNK_W*1.5;
  if(G.skyProps.length>160) G.skyProps=G.skyProps.filter(q=>q.x>cut);
}
function difficulty(){ return G.level + G.dist/3500; }
function spawnWave(){
  const d=difficulty();
  const want=clamp(2+Math.floor(d*0.32), 2, 6);
  for(let i=0;i<want;i++){
    if(G.enemies.length>=MAX_ENEMIES) break;
    const ahead = srand()<0.74;
    const x = ahead ? G.camX+viewW()+SPAWN_MARGIN+srange(0,200) : G.camX-SPAWN_MARGIN-srange(0,140);
    const lvl = Math.max(1, Math.round(G.level + G.dist/4200 + srange(-1,1.3)));
    const ra=srand(), rb=srand();
    const cls = ra<0.34?'rock' : ra<0.67?'scissors':'paper';
    const role = rb<0.17?'siege' : rb<0.36?'ranged':'melee';
    const e=makeEnemy(cls, role, x, lvl);
    e.face = ahead?-1:1;
    G.enemies.push(e);
  }
}

/* ============================ PLAYER / PHYSICS ============================ */
function setState(p,s){ if(p.state===s) return; p.state=s; p.stateT=0; }
function updatePlayer(p, dt){
  p.anim+=dt; p.stateT+=dt;
  if(p.atkAnim>0) p.atkAnim=Math.max(0,p.atkAnim-dt*2.4);
  if(p.hurt>0)    p.hurt=Math.max(0,p.hurt-dt);
  if(p.iframes>0){ p.iframes-=dt; p.blink+=dt; }
  if(p.duckCd>0)  p.duckCd-=dt;
  if(p.atkTimer>0)p.atkTimer-=dt;

  const c=CLASSES[p.cls], inp=readInput();
  const attacking=(p.state==='atkQuick'||p.state==='atkHeavy');
  const locked = attacking || p.state==='duck' || p.state==='hurt';

  let ax=0;
  if(!locked){ if(inp.left)ax-=1; if(inp.right)ax+=1; }
  if(ax!==0) p.face=ax>0?1:-1;
  if(p.grounded){
    if(ax!==0){ p.vx=lerp(p.vx, ax*c.speed, 0.34); if(p.state==='idle') setState(p,'walk'); }
    else { p.vx*=GROUND_FRICTION; if(p.state==='walk') setState(p,'idle'); }
  } else if(ax!==0){ p.vx=lerp(p.vx, ax*c.speed, AIR_CONTROL*0.5); }

  if(!locked && inp.up && p.grounded){
    // cap the jump to the headroom actually on screen (world y=0 is the top of the view)
    const head=(p.y-p.r)-12, vCap=-Math.sqrt(2*GRAVITY*Math.max(30,head*0.85));
    p.vy=Math.max(JUMP_V, vCap); p.grounded=false; setState(p,'jump'); Audio.boing(); }
  if(!locked && inp.down && p.grounded && p.duckCd<=0){
    setState(p,'duck'); p.iframes=Math.max(p.iframes,DUCK_TIME);
    p.duckCd=DUCK_TIME+DUCK_CD; p.vx*=0.25; Audio.squeak();
    floatText(p.x,p.y-p.r-18,'DODGE',15);
  }
  if(p.state==='duck' && p.stateT>=DUCK_TIME) setState(p,'idle');
  if(p.state==='hurt' && p.stateT>0.34) setState(p, p.grounded?'idle':'jump');

  if(!attacking && p.state!=='hurt' && p.state!=='duck' && p.atkTimer<=0){
    if(inp.heavy) startAttack(p,'heavy');
    else if(inp.quick) startAttack(p,'quick');
  }
  if(attacking) stepAttack(p,dt);

  p.vy+=GRAVITY*dt;
  p.x+=p.vx*dt; p.y+=p.vy*dt;
  const gy=groundY()-p.r;
  if(p.y>=gy){ p.y=gy; p.vy=0; if(!p.grounded){ p.grounded=true; if(p.state==='jump') setState(p,'idle'); } }
  else p.grounded=false;
  if(p.x<40){ p.x=40; p.vx=Math.max(0,p.vx); }
}
function faceThreat(p,kind){            // attack assist: turn toward whoever is actually in range
  const a=ATK[kind], reach=p.r*0.55 + p.r*a.reach;
  let best=null, bd=1e9;
  for(const e of G.enemies){ if(e.dead) continue;
    if(Math.abs(e.y-p.y)>(p.r+e.r)*1.7) continue;
    const d=Math.abs(e.x-p.x)-e.r;
    if(d<=reach && d<bd){ bd=d; best=e; } }
  if(best) p.face = (best.x>=p.x)?1:-1;
}
function startAttack(p,kind){
  const c=CLASSES[p.cls], a=ATK[kind], sc=c.atkScale||1;
  faceThreat(p,kind);
  p.atkKind=kind; setState(p, kind==='quick'?'atkQuick':'atkHeavy');
  p.hitList.length=0; p.atkAnim=1;
  // cooldown must outlast the (class-scaled) swing, or the stat does nothing
  const cd = kind==='quick'?c.quickCd:c.heavyCd;
  p.atkTimer = (a.wind+a.active+a.rec)*sc + cd*0.5;
  Audio.march();
}
function stepAttack(p,dt){
  const a=ATK[p.atkKind], sc=CLASSES[p.cls].atkScale||1, t=p.stateT;
  const wind=a.wind*sc, active=a.active*sc, rec=a.rec*sc;
  if(t>=wind && t<wind+active){
    const reach=p.r*a.reach;
    const hx=p.x+p.face*(p.r*0.55+reach*0.5), hy=p.y;
    const hw=reach, hh=p.r*1.8;
    for(const e of G.enemies){
      if(e.dead || p.hitList.indexOf(e.id)>=0) continue;
      if(Math.abs(e.x-hx)<=hw*0.5+e.r && Math.abs(e.y-hy)<=hh*0.5+e.r){
        p.hitList.push(e.id); hitEnemy(p,e,a,p.atkKind);
      }
    }
  }
  if(t>=wind+active+rec) setState(p, p.grounded?'idle':'jump');
}

/* ================================= COMBAT ================================= */
function hitEnemy(p,e,a,kind){
  e.hp-=p.atk*a.dmg;
  e.hurt=0.2; e.staggerT = kind==='heavy'?0.42:0.20;
  e.st='stagger'; e.stT=0;
  e.vx += p.face*a.kb; e.vy=Math.min(e.vy,-a.kb*0.32); e.grounded=false;
  spark(e.x,e.y,1.4);
  G.hitstop=Math.max(G.hitstop,a.stop);
  shake(kind==='heavy'?7:3.5);
  Audio.hitTick();
  G.combo++; G.comboT=1.3; if(G.combo>G.comboBest) G.comboBest=G.combo;
  if(kind==='heavy' || G.combo>=3) floatText(e.x, e.y-e.r-16, pick(a.words), kind==='heavy'?22:18);
  if(e.hp<=0) killEnemy(e);
}
function killEnemy(e){
  if(e.dead) return; e.dead=true;
  puff(e.x,e.y,e.r);
  G.kills++;
  const mult=1+Math.min(G.combo,10)*0.12;
  G.score+=Math.round(12*e.level*mult);
  gainXp(e.xpValue);
  Audio.pop();
}
function gainXp(n){
  G.xp+=n;
  let ups=0;
  while(G.xp>=G.xpNext && ups<20){
    G.xp-=G.xpNext; G.level++; G.xpNext=xpFor(G.level); ups++;
    const before=rankName(G.cls,G.level-1), after=rankName(G.cls,G.level);
    applyLevel(G.player);
    G.player.hp=clamp(G.player.hp+G.player.maxHp*0.35,0,G.player.maxHp);
    G.player.atkAnim=1;
    if(before!==after){ bigPuff(G.player.x,G.player.y); Audio.fanfare(); flash('RANK UP  —  '+after.toUpperCase()); }
    else { Audio.boing(); flash('LEVEL '+G.level); }
  }
}
function hurtPlayer(dmg,dir){
  const p=G.player;
  if(p.iframes>0 || p.dead || UI.mode!=='play') return;
  p.hp-=dmg; p.hurt=0.28; setState(p,'hurt');
  p.vx=dir*230; p.vy=-190; p.grounded=false;
  p.iframes=HURT_IFRAMES; G.combo=0;
  spark(p.x,p.y,0.7); shake(6); Audio.crash();
  if(p.hp<=0) playerDown();
}
function playerDown(){
  const p=G.player;
  bigPuff(p.x,p.y); G.lives--;
  if(G.lives<=0){ endRun(); return; }
  flash(G.lives+(G.lives===1?' LIFE LEFT':' LIVES LEFT'));
  p.hp=p.maxHp; p.iframes=RESPAWN_IFRAMES; setState(p,'idle'); p.vx=0; p.vy=0;
  for(const e of G.enemies){ const d=Math.abs(e.x-p.x);
    if(d<360){ e.dead=true; puff(e.x,e.y,e.r); }            // clear the pile you died in
    else if(d<560){ e.vx += (e.x>p.x?1:-1)*420; e.st='stagger'; e.stT=0; e.staggerT=0.6; } }
}
function endRun(){ if(G.result) return; clearInput(); G.result='over'; UI.mode='over'; G.overT=0;
  if(G.score>BEST) BEST=G.score; Audio.sadTrombone(); }

/* ================================ ENEMY AI ================================ */
function updateEnemy(e,dt){
  e.anim+=dt; e.stT+=dt;
  if(e.atkAnim>0) e.atkAnim=Math.max(0,e.atkAnim-dt*2.4);
  if(e.hurt>0) e.hurt=Math.max(0,e.hurt-dt);
  if(e.atkTimer>0) e.atkTimer-=dt;
  const R=E_ROLE[e.role], p=G.player;
  const dx=p.x-e.x, adx=Math.abs(dx), ady=Math.abs(p.y-e.y);
  if(e.st!=='stagger') e.face = dx>=0?1:-1;

  if(e.st==='stagger'){
    e.vx*=0.90;
    if(e.stT>=e.staggerT){ e.st='approach'; e.stT=0; }
  } else if(e.st==='approach'){
    const want = e.thrower? e.reach*0.75 : e.reach*0.80;
    if(adx>want) e.vx=lerp(e.vx,(dx>=0?1:-1)*e.speed,0.13);
    else { e.vx*=0.86; if(e.atkTimer<=0 && ady<e.r*3.2){ e.st='wind'; e.stT=0; } }
  } else if(e.st==='wind'){
    e.vx*=0.80;                                        // telegraph: they visibly wind up
    if(e.stT>=R.wind){ e.st='strike'; e.stT=0; e.atkAnim=1; doEnemyAttack(e); }
  } else if(e.st==='strike'){
    if(e.stT>=R.strike){ e.st='recover'; e.stT=0; }
  } else {
    e.vx*=0.85;
    if(e.stT>=R.recover){ e.st='approach'; e.stT=0; e.atkTimer=e.atkCd; }
  }

  e.vy+=GRAVITY*dt;
  e.x+=e.vx*dt; e.y+=e.vy*dt;
  const gy=groundY()-e.r;
  if(e.y>=gy){ e.y=gy; e.vy=0; e.grounded=true; } else e.grounded=false;

  for(const o of G.enemies){ if(o===e||o.dead) continue;      // keep them from stacking into one blob
    const gap=(e.r+o.r)*1.15, d=e.x-o.x, ad=Math.abs(d);
    if(ad<gap){ const push=(gap-ad)/gap; e.vx += (d>=0?1:-1)*760*push*dt; } }

  // despawn margin must always exceed the spawn margin, at any viewport width
  const vw=viewW();
  const keepAhead=Math.max(vw*0.9, SPAWN_MARGIN+600);
  const keepBehind=SPAWN_MARGIN+260;      // > the 290-unit behind-spawn band + camera lag
  if(e.x < G.camX-keepBehind || e.x > G.camX+vw+keepAhead) e.dead=true;
}
function doEnemyAttack(e){
  const p=G.player;
  if(e.thrower){ spawnProjectile(e); Audio.march(); return; }
  const adx=Math.abs(p.x-e.x), ady=Math.abs(p.y-e.y);
  if(adx<=e.reach+p.r && ady<=(e.r+p.r)*1.6) hurtPlayer(e.atk, (p.x-e.x)>=0?1:-1);
}

/* ============================== PROJECTILES =============================== */
function spawnProjectile(e){
  G.projectiles.push({ x:e.x+e.face*e.r, y:e.y-e.r*0.35, vx:e.face*400, vy:-70,
    army:e.army, role:e.role, dmg:e.atk, life:2.4, spin:srand()*TAU });
}
function updateProjectiles(dt){
  const p=G.player;
  for(const q of G.projectiles){
    q.life-=dt; q.spin+=dt*16; q.vy+=GRAVITY*0.20*dt;
    q.x+=q.vx*dt; q.y+=q.vy*dt;
    if(q.life<=0||q.y>groundY()+12||q.x<G.camX-240||q.x>G.camX+viewW()+240){ q.dead=true; continue; }
    if(dist2(q.x,q.y,p.x,p.y)<(p.r+8)*(p.r+8)){ q.dead=true; hurtPlayer(q.dmg,(q.vx>=0?1:-1)); }
  }
  G.projectiles=G.projectiles.filter(q=>!q.dead);
}

/* =============================== PICKUPS ================================== */
function updatePickups(dt){
  const p=G.player;
  for(const k of G.pickups){
    k.bob+=dt*3;
    const ky=groundY()+(k.yOff!==undefined?k.yOff:-30);
    if(dist2(k.x,ky,p.x,p.y)<(p.r+24)*(p.r+24)){
      k.dead=true;
      p.hp=clamp(p.hp+p.maxHp*HEALTH_PACK_FRAC,0,p.maxHp);
      floatText(p.x,p.y-p.r-22,'+INK',18); Audio.boing(); G.score+=25;
    }
  }
  G.pickups=G.pickups.filter(k=>!k.dead);
}

/* =============================== PARTICLES ================================ */
function spark(x,y,mult){ G.particles.push({k:'spark',x,y,t:0,life:0.22,mult}); }
function puff(x,y,r){
  for(let i=0;i<7;i++){ const a=srange(0,TAU), s=srange(20,80);
    G.particles.push({k:'puff',x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,t:0,life:srange(0.4,0.7),r:r*srange(0.4,0.9)}); }
  floatText(x,y,'POOF',14);
}
function bigPuff(x,y){
  for(let i=0;i<24;i++){ const a=srange(0,TAU), s=srange(40,200);
    G.particles.push({k:'puff',x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,t:0,life:srange(0.5,1.1),r:srange(14,38)}); }
}
function floatText(x,y,txt,s){ G.floats.push({x,y,t:0,life:0.7,txt,s:s||16}); }
function updateParticles(dt){
  for(const q of G.particles){ q.t+=dt; if(q.vx!==undefined){ q.x+=q.vx*dt; q.y+=q.vy*dt; q.vx*=0.92; q.vy*=0.92; } }
  G.particles=G.particles.filter(q=>q.t<q.life);
  for(const f of G.floats){ f.t+=dt; f.y-=26*dt; }
  G.floats=G.floats.filter(f=>f.t<f.life);
}
function shake(m){ G.shakeMag=Math.max(G.shakeMag,m); G.shakeT=0.22; }

/* ================================= UPDATE ================================= */
function updateCamera(dt){
  const p=G.player;
  const target=p.x-viewW()*0.44+p.face*70;
  G.camX=lerp(G.camX, Math.max(0,target), clamp(dt*7,0,1));
  if(G.shakeT>0){ G.shakeT-=dt; if(G.shakeT<=0) G.shakeMag=0; }
}
function update(dt){
  if(UI.mode!=='play') return;
  if(G.hitstop>0){ G.hitstop-=dt; return; }       // impact freeze (never mutate STEP)
  G.time+=dt;
  if(G.msgT>0) G.msgT-=dt;
  if(G.comboT>0){ G.comboT-=dt; if(G.comboT<=0) G.combo=0; }

  updatePlayer(G.player,dt);
  G.dist=Math.max(G.dist,G.player.x);
  for(const e of G.enemies) updateEnemy(e,dt);
  updateProjectiles(dt);
  updatePickups(dt);
  updateParticles(dt);
  G.enemies=G.enemies.filter(e=>!e.dead);
  updateCamera(dt);
  ensureChunks(); ensureSky();

  G.waveT-=dt;
  let near=0; for(const e of G.enemies) if(e.x>G.camX-SPAWN_MARGIN-200) near++;
  if(G.waveT<=0 && near<Math.max(3,MAX_ENEMIES-3)){
    spawnWave(); G.waveT=clamp(4.4-difficulty()*0.17, 1.4, 4.4);
  }
  G.score+=dt*2;
  // guaranteed lifeline: if badly hurt with nothing on screen, drop a pack ahead
  if(G.player.hp/G.player.maxHp<0.35 && G.pickups.length===0)
    G.pickups.push({x:G.camX+viewW()*0.8, yOff:-30, kind:'health', bob:0});
}

/* ================================== INPUT ================================= */
const keys={};
const touches=new Map();          // Touch.identifier -> {kind:'dpad'|'quick'|'heavy', dir}
let mouseX=0, mouseY=0, mouseIn=false;

function padGeom(){
  const m=Math.min(VW,VH);
  const R=clamp(m*0.17, 60, 108);
  const br=clamp(m*0.115, 40, 68);
  return {
    pad:{ cx: SAFE.l+R+22, cy: VH-SAFE.b-R-22, r:R },
    bq :{ cx: VW-SAFE.r-br*2.6-24, cy: VH-SAFE.b-br-24, r:br },   // QUICK (inner/lower)
    bh :{ cx: VW-SAFE.r-br-20,     cy: VH-SAFE.b-br*2.5-24, r:br } // HEAVY (outer/upper)
  };
}
function dpadDir(dx,dy,R){
  const d=Math.hypot(dx,dy);
  if(d<R*0.24) return null;                                        // dead zone
  return Math.abs(dx)>Math.abs(dy) ? (dx>0?'right':'left') : (dy>0?'down':'up');
}
function classifyTouch(x,y){
  const g=padGeom();
  const dq=dist2(x,y,g.bq.cx,g.bq.cy), dh=dist2(x,y,g.bh.cx,g.bh.cy);
  const inQ=dq<=(g.bq.r*1.30)*(g.bq.r*1.30), inH=dh<=(g.bh.r*1.30)*(g.bh.r*1.30);
  if(inQ&&inH) return (dq<=dh)?{kind:'quick'}:{kind:'heavy'};   // overlap -> nearest centre wins
  if(inQ) return {kind:'quick'};
  if(inH) return {kind:'heavy'};
  if(dist2(x,y,g.pad.cx,g.pad.cy)<=(g.pad.r*1.55)*(g.pad.r*1.55))
    return {kind:'dpad', dir:dpadDir(x-g.pad.cx,y-g.pad.cy,g.pad.r)};
  return null;
}
function readInput(){
  const o={left:false,right:false,up:false,down:false,quick:false,heavy:false};
  if(keys['arrowleft']||keys['a'])  o.left=true;
  if(keys['arrowright']||keys['d']) o.right=true;
  if(keys['arrowup']||keys['w'])    o.up=true;
  if(keys['arrowdown']||keys['s'])  o.down=true;
  if(keys['j']||keys['z']||keys[' ']) o.quick=true;
  if(keys['k']||keys['x'])          o.heavy=true;
  for(const t of touches.values()){
    if(t.kind==='dpad'){ if(t.dir) o[t.dir]=true; }
    else o[t.kind]=true;
  }
  return o;
}
/* one place that turns a press into a UI action, shared by touch + mouse */
function pressAt(x,y){
  if(blocked()) return false;      // nothing behind the rotate card is clickable
  if(UI.mode==='menu'){ const c=menuHit(x,y); if(c){ startRun(c); return true; } return false; }
  if(UI.mode==='over'){ if(hitRect(x,y,overBtn)){ clearInput(); UI.mode='menu'; G=null; return true; } return false; }
  for(const b of buttons){ if(hitRect(x,y,b)){ b.action(); return true; } }
  return false;
}
function onTouchStart(ev){
  ev.preventDefault(); Audio.resumeOnGesture();
  if(blocked()){ touches.clear(); return; }
  for(let i=0;i<ev.changedTouches.length;i++){
    const t=ev.changedTouches[i], x=t.clientX, y=t.clientY;
    if(pressAt(x,y)) continue;
    if(UI.mode!=='play') continue;          // menu / game-over presses can't become gameplay input
    const c=classifyTouch(x,y); if(c) touches.set(t.identifier,c);
  }
}
function onTouchMove(ev){
  ev.preventDefault();
  if(blocked()) return;
  const g=padGeom();
  for(let i=0;i<ev.changedTouches.length;i++){
    const t=ev.changedTouches[i], cur=touches.get(t.identifier);
    if(!cur||cur.kind!=='dpad') continue;
    cur.dir=dpadDir(t.clientX-g.pad.cx, t.clientY-g.pad.cy, g.pad.r);
  }
}
function onTouchEnd(ev){
  ev.preventDefault();
  for(let i=0;i<ev.changedTouches.length;i++) touches.delete(ev.changedTouches[i].identifier);
}
cv.addEventListener('touchstart',onTouchStart,{passive:false});
cv.addEventListener('touchmove', onTouchMove ,{passive:false});
cv.addEventListener('touchend',  onTouchEnd  ,{passive:false});
cv.addEventListener('touchcancel',onTouchEnd ,{passive:false});

window.addEventListener('keydown',e=>{
  const k=e.key.toLowerCase(); keys[k]=true;
  if(k===' '||k==='arrowup'||k==='arrowdown') e.preventDefault();
  if(e.repeat) return;                 // one-shot actions below fire once per physical press
  if(k==='m') Audio.toggleMute();
});
window.addEventListener('keyup',e=>{ keys[e.key.toLowerCase()]=false; });
window.addEventListener('blur',()=>{ for(const k in keys) keys[k]=false; touches.clear(); });
cv.addEventListener('mousemove',e=>{ mouseX=e.clientX; mouseY=e.clientY; mouseIn=true;
  const cur=touches.get('mouse');
  if(cur && cur.kind==='dpad'){ const g=padGeom(); cur.dir=dpadDir(e.clientX-g.pad.cx, e.clientY-g.pad.cy, g.pad.r); }
  if(UI.mode==='menu') UI.hover=menuHit(e.clientX,e.clientY); });
cv.addEventListener('mouseleave',()=>{ mouseIn=false; touches.delete('mouse'); });
cv.addEventListener('mousedown',e=>{
  Audio.resumeOnGesture();
  if(blocked()) return;
  if(pressAt(e.clientX,e.clientY)) return;
  if(UI.mode!=='play') return;
  const c=classifyTouch(e.clientX,e.clientY); if(c) touches.set('mouse',c);   // on-screen pad works with a mouse too
});
window.addEventListener('mouseup',()=>{ touches.delete('mouse'); });
window.addEventListener('contextmenu',e=>e.preventDefault());
function hitRect(x,y,r){ return !!r && x>=r.x&&x<=r.x+r.w&&y>=r.y&&y<=r.y+r.h; }

/* ============================ CHARACTER ART =============================== */
/* Bodies draw in local space centred on (0,0). */
function shade(army){ return ARMY_FILL[army]; }
function pieEyes(r,scale){ scale=scale||1;
  const ex=r*0.34*scale, ey=-r*0.18*scale, er=r*0.26*scale;
  for(const s of [-1,1]){
    ctx.beginPath(); ctx.arc(s*ex,ey,er,0,TAU); ctx.fillStyle='#fff'; ctx.fill();
    ctx.lineWidth=Math.max(1.4,r*0.07); ctx.strokeStyle=INK; ctx.stroke();
    ctx.beginPath(); ctx.moveTo(s*ex,ey); ctx.arc(s*ex,ey,er*0.95,-0.5,1.4); ctx.closePath();
    ctx.fillStyle=INK; ctx.fill();
  }
}
function gloveHand(x,y,r){ ctx.beginPath(); ctx.arc(x,y,r*0.22,0,TAU); ctx.fillStyle='#fff'; ctx.fill();
  ctx.lineWidth=Math.max(1.4,r*0.06); ctx.strokeStyle=INK; ctx.stroke(); }
function inkOutline(r){ ctx.lineWidth=Math.max(2.4,r*0.16); ctx.strokeStyle=INK; ctx.lineJoin='round'; ctx.stroke(); }

function drawMeleeBody(u,r){
  const fill=shade(u.army);
  if(u.army==='rock'){
    ctx.beginPath(); const N=7;
    for(let i=0;i<=N;i++){ const a=i/N*TAU, rr=r*(0.92+Math.sin(a*3+u.id)*0.12);
      const x=Math.cos(a)*rr, y=Math.sin(a)*rr*0.95; i===0?ctx.moveTo(x,y):ctx.lineTo(x,y); }
    ctx.closePath(); ctx.fillStyle=fill; ctx.fill(); inkOutline(r);
  } else if(u.army==='paper'){
    ctx.beginPath(); ctx.moveTo(-r*0.9,-r*0.7); ctx.lineTo(r*0.5,-r*0.95); ctx.lineTo(r*0.95,-r*0.1);
    ctx.lineTo(r*0.6,r*0.9); ctx.lineTo(-r*0.6,r*0.85); ctx.lineTo(-r,0.1*r); ctx.closePath();
    ctx.fillStyle=fill; ctx.fill(); inkOutline(r);
    ctx.beginPath(); ctx.moveTo(-r*0.4,-r*0.4); ctx.lineTo(r*0.2,0); ctx.lineTo(-r*0.2,r*0.5);
    ctx.strokeStyle='rgba(40,33,24,0.4)'; ctx.lineWidth=1.5; ctx.stroke();
  } else {
    ctx.beginPath(); ctx.arc(0,0,r*0.9,0,TAU); ctx.fillStyle=fill; ctx.fill(); inkOutline(r);
    ctx.strokeStyle=INK; ctx.lineWidth=Math.max(2,r*0.12);
    ctx.beginPath(); ctx.moveTo(-r*0.2,-r*0.2); ctx.lineTo(r*0.9,-r*0.9);
    ctx.moveTo(-r*0.2,r*0.2); ctx.lineTo(r*0.9,r*0.9); ctx.stroke();
  }
  pieEyes(r); gloveHand(-r*0.95,r*0.5,r); gloveHand(r*0.95,r*0.5,r);
}
function drawRangedBody(u,r){

  ctx.beginPath(); ctx.ellipse(0,0,r*0.78,r*1.05,0,0,TAU); ctx.fillStyle=fill; ctx.fill(); inkOutline(r);
  pieEyes(r,0.9);
  ctx.lineWidth=Math.max(2,r*0.12); ctx.strokeStyle=INK;
  ctx.beginPath(); ctx.moveTo(r*0.2,0); ctx.quadraticCurveTo(r*1.1,-r*0.2,r*1.2,-r*0.8); ctx.stroke();

function drawSiegeBody(u,r){
  const fill=shade(u.army);

  else { ctx.moveTo(-r,-r*0.5); ctx.lineTo(-r*0.6,-r); ctx.lineTo(r*0.6,-r); ctx.lineTo(r,-r*0.5);
         ctx.lineTo(r,r*0.7); ctx.lineTo(-r,r*0.7); ctx.closePath(); }
  ctx.fillStyle=fill; ctx.fill(); inkOutline(r);
  ctx.fillStyle=INK; for(let i=-1;i<=1;i++){ ctx.beginPath(); ctx.arc(i*r*0.55,r*0.55,r*0.12,0,TAU); ctx.fill(); }
  pieEyes(r,0.85); gloveHand(-r*1.05,0,r*1.1); gloveHand(r*1.05,0,r*1.1);
}
/* squash/stretch transform stack — u.face is a +/-1 mirror */
function drawUnit(u,t,own){
  const bounce=Math.sin(u.anim*6+u.id)*0.06;
  const moving=Math.abs(u.vx)>14;
  const ducking=(u===G.player && u.state==='duck');
  let sx=1+(u.atkAnim*0.28)-bounce*0.5+(moving?Math.abs(Math.sin(u.anim*10))*0.05:0);
  let sy=1-(u.atkAnim*0.22)+bounce+(moving?-Math.abs(Math.sin(u.anim*10))*0.04:0);
  if(ducking){ sx*=1.28; sy*=0.60; }                       // the dodge reads as a big squash
  const r=u.r;
  ctx.save();
  if(u.iframes>0 && u===G.player) ctx.globalAlpha = 0.45+0.55*Math.abs(Math.sin(u.blink*22));
  ctx.translate(u.x, u.y-Math.abs(bounce)*r + (ducking?r*0.38:0));
  ctx.save(); ctx.scale(1,0.4); ctx.beginPath(); ctx.arc(0,(r*0.9)/0.4*0.4+r*0.6,r*0.92,0,TAU);
  ctx.fillStyle='rgba(20,16,10,0.28)'; ctx.fill(); ctx.restore();
  ctx.scale(u.face*sx, sy);
  if(u.role==='melee') drawMeleeBody(u,r);
  else if(u.role==='ranged') drawRangedBody(u,r);
  else drawSiegeBody(u,r);
  if(u.hurt>0){ ctx.globalAlpha=u.hurt*1.6; ctx.fillStyle='#fff';
    ctx.beginPath(); ctx.arc(0,0,r*1.05,0,TAU); ctx.fill(); ctx.globalAlpha=1; }
  ctx.restore();
  if(u===G.player){                                  // player marker
    ctx.save(); ctx.translate(u.x, u.y-r-26-Math.abs(bounce)*r);
    ctx.globalAlpha=0.9; ctx.fillStyle=SEPIA; ctx.strokeStyle=INK; ctx.lineWidth=2;
    ctx.beginPath(); ctx.moveTo(0,7); ctx.lineTo(-7,-5); ctx.lineTo(7,-5); ctx.closePath();
    ctx.fill(); ctx.stroke(); ctx.restore();
  }
  // enemy wind-up telegraph ring
  if(u!==G.player && u.st==='wind'){
    ctx.save(); ctx.globalAlpha=0.85; ctx.strokeStyle=SEPIA; ctx.lineWidth=3;
    ctx.beginPath(); ctx.arc(u.x,u.y,r*1.5,0,TAU); ctx.stroke(); ctx.restore();
  }
  if(u.hp<u.maxHp-0.5) drawBar(u.x, u.y-r-13-Math.abs(bounce)*r, r*2.0, 4, u.hp/u.maxHp, own);
  if(u!==G.player && u.tier>1){ ctx.save(); ctx.translate(u.x,u.y-r-19); ctx.fillStyle=SEPIA;
    for(let i=0;i<Math.min(u.tier,4)-1;i++){ ctx.beginPath();
      ctx.arc((i-(Math.min(u.tier,4)-2)/2)*6,0,2,0,TAU); ctx.fill(); } ctx.restore(); }
}
function drawProjectile(p,t){

function placard(x,y,w,h,active,hot){

function decoCorner(s){
  ctx.strokeStyle=INK; ctx.fillStyle=INK; ctx.lineJoin='round'; ctx.lineCap='round';
  ctx.lineWidth=Math.max(2,s*0.085);
  ctx.beginPath(); ctx.moveTo(s,0); ctx.lineTo(0,0); ctx.lineTo(0,s); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(s*0.64,s*0.16); ctx.lineTo(s*0.16,s*0.16); ctx.lineTo(s*0.16,s*0.64); ctx.stroke();
  ctx.lineWidth=Math.max(1.4,s*0.05);
  for(const a of [0.18,0.5,0.82]){ const ang=a*(Math.PI/2);
    ctx.beginPath(); ctx.moveTo(s*0.27,s*0.27);
    ctx.lineTo(s*0.27+Math.cos(ang)*s*0.6, s*0.27+Math.sin(ang)*s*0.6); ctx.stroke(); }
  ctx.beginPath(); ctx.arc(0,0,s*0.11,0,TAU); ctx.fill();
}
function ornateFrame(x,y,w,h){
  const s=Math.min(30,Math.min(w,h)*0.16), pad=8;
  ctx.save();
  ctx.strokeStyle=INK; ctx.lineWidth=2; ctx.strokeRect(x+pad,y+pad,w-2*pad,h-2*pad);
  ctx.lineWidth=1; ctx.strokeRect(x+pad+4,y+pad+4,w-2*pad-8,h-2*pad-8);
  const C=[[x,y,0],[x+w,y,1],[x+w,y+h,2],[x,y+h,3]];
  for(const c of C){ ctx.save(); ctx.translate(c[0],c[1]); ctx.rotate(c[2]*Math.PI/2); decoCorner(s); ctx.restore(); }
  ctx.restore();
}
function drawMenuGesture(a,t){
  ctx.save(); const breath=1+Math.sin(t*2)*0.04; ctx.scale(breath,breath);
  ctx.fillStyle='#fff'; ctx.strokeStyle=INK; ctx.lineWidth=5;

  else if(a==='paper'){ ctx.beginPath(); ctx.roundRect(-32,-8,64,48,12); ctx.fill(); ctx.stroke();
    for(let i=0;i<4;i++){ ctx.beginPath(); ctx.roundRect(-32+i*16,-42,13,38,7); ctx.fill(); ctx.stroke(); }
    ctx.beginPath(); ctx.roundRect(-48,0,16,32,8); ctx.fill(); ctx.stroke(); }

  ctx.restore();
}
function boilOffset(i,t){ const q=Math.floor(t*7), a=hash2(i,q), b=hash2(i,q+1), f=t*7-q;
  return { x:(lerp(a,b,f)-0.5)*7, y:(lerp(hash2(i+99,q),hash2(i+99,q+1),f)-0.5)*7 }; }

/* ============================== WORLD RENDER ============================== */
function drawSky(t){
  const g=ctx.createLinearGradient(0,0,0,VH);
  g.addColorStop(0,'#26221b'); g.addColorStop(0.62,'#171410'); g.addColorStop(1,'#0d0c0a');
  ctx.fillStyle=g; ctx.fillRect(0,0,VW,VH);
  const moonX=VW*0.78, moonY=VH*0.18, mr=Math.min(VW,VH)*0.07;
  ctx.save(); ctx.globalAlpha=0.5; ctx.beginPath(); ctx.arc(moonX,moonY,mr,0,TAU);
  ctx.fillStyle='#efe7d4'; ctx.fill(); ctx.lineWidth=4; ctx.strokeStyle=INK; ctx.stroke(); ctx.restore();
}
function drawParallax(t){
  const gy=groundY(), px=G.camX*0.38, Z=zoomLevel(), vw=viewW();
  ctx.save(); ctx.setTransform(DPR*Z,0,0,DPR*Z,-px*Z*DPR,0);
  for(const p of G.skyProps){
    if(p.x<px-360 || p.x>px+vw+420) continue;
    const w=p.w*0.62, h=p.hh;
    ctx.fillStyle='#332c21'; ctx.strokeStyle=INK; ctx.lineWidth=4;
    ctx.beginPath(); ctx.rect(p.x,gy-h,w,h); ctx.fill(); ctx.stroke();
    ctx.fillStyle='rgba(239,231,212,0.17)';
    for(let wy=gy-h+20; wy<gy-26; wy+=34)
      for(let wx=p.x+13; wx<p.x+w-16; wx+=28) ctx.fillRect(wx,wy,13,17);
  }
  ctx.restore();
}
function drawGround(t){
  const gy=groundY(), seg=64, vh=VH/zoomLevel();   // VH is SCREEN px; this fn draws in WORLD units
  const x0=Math.floor((G.camX-140)/seg)*seg, x1=G.camX+viewW()+140;
  const edge=[];
  for(let x=x0;x<=x1;x+=seg) edge.push({x, y:gy+boilOffset(Math.floor(x/seg),t).y*0.5});
  ctx.save();
  ctx.beginPath(); ctx.moveTo(edge[0].x,edge[0].y);
  for(const e of edge) ctx.lineTo(e.x,e.y);
  const deep=gy+vh; ctx.lineTo(x1,deep); ctx.lineTo(x0,deep); ctx.closePath();
  const pg=ctx.createLinearGradient(0,gy,0,gy+vh*0.5);
  pg.addColorStop(0,'#efe7d3'); pg.addColorStop(1,'#c9bd9c');
  ctx.fillStyle=pg; ctx.fill();
  if(ART.paperReady){
    if(!ART.paperPat) ART.paperPat=ctx.createPattern(ART.paper,'repeat');
    if(ART.paperPat){ ctx.save(); ctx.clip(); ctx.globalCompositeOperation='multiply'; ctx.globalAlpha=0.45;
      ctx.fillStyle=ART.paperPat; ctx.fillRect(x0,gy-30,x1-x0,vh+30); ctx.restore(); }
  }
  ctx.restore();
  ctx.beginPath(); ctx.moveTo(edge[0].x,edge[0].y);
  for(const e of edge) ctx.lineTo(e.x,e.y);
  ctx.lineWidth=7; ctx.strokeStyle=INK; ctx.lineJoin='round'; ctx.stroke();
  // floor ticks: give the endless run a readable sense of speed
  ctx.save(); ctx.strokeStyle='rgba(21,17,13,0.18)'; ctx.lineWidth=3; ctx.lineCap='round';
  for(let x=Math.floor((G.camX-160)/90)*90; x<x1; x+=90){
    const j=hash2(Math.floor(x/90),5)*24;
    ctx.beginPath(); ctx.moveTo(x+j, gy+20);    ctx.lineTo(x+j+34, gy+20); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(x+j+52, gy+44); ctx.lineTo(x+j+74, gy+44); ctx.stroke();
  }
  ctx.restore();
}
function drawProps(t){
  const gy=groundY(), vw=viewW();
  for(const p of G.props){
    if(p.layer!==0) continue;
    if(p.x<G.camX-160 || p.x>G.camX+vw+160) continue;
    const s=p.s;
    ctx.save(); ctx.translate(p.x,gy); ctx.strokeStyle=INK; ctx.lineWidth=4; ctx.lineJoin='round';
    if(p.kind==='lamp'){
      ctx.beginPath(); ctx.moveTo(0,0); ctx.lineTo(0,-90*s); ctx.stroke();
      ctx.beginPath(); ctx.arc(0,-96*s,11*s,0,TAU); ctx.fillStyle='#efe7d4'; ctx.fill(); ctx.stroke();
      ctx.save(); ctx.globalAlpha=0.10; ctx.beginPath(); ctx.moveTo(0,-92*s);
      ctx.lineTo(-52*s,0); ctx.lineTo(52*s,0); ctx.closePath(); ctx.fillStyle='#efe7d4'; ctx.fill(); ctx.restore();
    } else if(p.kind==='crate'){
      const w=40*s;
      ctx.beginPath(); ctx.rect(-w/2,-w,w,w); ctx.fillStyle='#8d8472'; ctx.fill(); ctx.stroke();
      ctx.lineWidth=2; ctx.beginPath(); ctx.moveTo(-w/2,-w); ctx.lineTo(w/2,0); ctx.moveTo(w/2,-w); ctx.lineTo(-w/2,0); ctx.stroke();
    } else {
      ctx.beginPath(); ctx.roundRect(-7*s,-34*s,14*s,34*s,5*s); ctx.fillStyle='#736a55'; ctx.fill(); ctx.stroke();
    }
    ctx.restore();
  }
}
function drawPickups(t){

function drawParticles(t){
  for(const p of G.particles){

function drawHUD(t){

    placard(VW/2-w/2, VH*0.16, w, 44, true,false);
    ctx.fillStyle=INK; ctx.fillText(G.msg, VW/2, VH*0.16+23); ctx.restore();

function drawThreatArrows(){        // enemies closing from off-screen, so you can't be blindsided
  const vw=viewW(), gy=groundY()*zoomLevel();
  let l=0, r=0;
  for(const e of G.enemies){ const rel=e.x-G.camX;
    if(rel>=-30 && rel<=vw+30) continue;
    if(rel<-460 || rel>vw+460) continue;
    if(rel<0) l++; else r++; }
  if(!l && !r) return;
  const y=clamp(gy-46, 70, VH-130), a=0.55+0.25*Math.sin(G.time*7);
  const arrow=(x,dir,n)=>{ ctx.save(); ctx.translate(x,y);
    ctx.globalAlpha=a; ctx.fillStyle=SEPIA; ctx.strokeStyle=INK; ctx.lineWidth=2;
    ctx.beginPath(); ctx.moveTo(dir*11,0); ctx.lineTo(-dir*7,-9); ctx.lineTo(-dir*7,9); ctx.closePath();
    ctx.fill(); ctx.stroke();
    if(n>1){ ctx.globalAlpha=0.9; ctx.fillStyle=PAPER;
      ctx.font='bold 10px "Courier New",monospace'; ctx.textAlign='center'; ctx.fillText(n,0,22); }
    ctx.restore(); };
  if(l) arrow(SAFE.l+18, -1, l);
  if(r) arrow(VW-SAFE.r-18, 1, r);
}
function drawLowHpPulse(){         // the corner HP bar is easy to miss mid-scrum
  const p=G.player, f=p.hp/p.maxHp;
  if(f>=0.3 || p.dead) return;
  const k=(0.30-Math.max(f,0))/0.30, pulse=(0.10+0.16*k)*(0.65+0.35*Math.sin(G.time*9));
  const g=ctx.createRadialGradient(VW/2,VH/2,Math.min(VW,VH)*0.22, VW/2,VH/2,Math.max(VW,VH)*0.62);
  g.addColorStop(0,'rgba(0,0,0,0)'); g.addColorStop(1,'rgba(21,17,13,'+pulse.toFixed(3)+')');
  ctx.fillStyle=g; ctx.fillRect(0,0,VW,VH);
}
/* ---- on-screen touch controls (drawn on canvas) ---- */
function drawControls(t){
  const g=padGeom(), inp=readInput();
  ctx.save(); ctx.globalAlpha=0.30;
  // d-pad
  ctx.beginPath(); ctx.arc(g.pad.cx,g.pad.cy,g.pad.r,0,TAU);
  ctx.fillStyle='#efe7d4'; ctx.fill(); ctx.lineWidth=4; ctx.strokeStyle=INK; ctx.stroke();
  const R=g.pad.r;
  const dirs=[['up',0,-1],['down',0,1],['left',-1,0],['right',1,0]];
  for(const d of dirs){
    const on=inp[d[0]];
    ctx.save(); ctx.globalAlpha=on?0.95:0.55;
    ctx.translate(g.pad.cx+d[1]*R*0.56, g.pad.cy+d[2]*R*0.56);
    ctx.rotate(Math.atan2(d[2],d[1])+Math.PI/2);
    ctx.beginPath(); ctx.moveTo(0,-R*0.20); ctx.lineTo(R*0.17,R*0.10); ctx.lineTo(-R*0.17,R*0.10); ctx.closePath();
    ctx.fillStyle=on?SEPIA:INK; ctx.fill(); ctx.restore();
  }
  ctx.save(); ctx.globalAlpha=0.5; ctx.font='bold 9px "Courier New",monospace'; ctx.textAlign='center';
  ctx.fillStyle=INK; ctx.fillText('JUMP', g.pad.cx, g.pad.cy-R*0.80);
  ctx.fillText('DODGE', g.pad.cx, g.pad.cy+R*0.88); ctx.restore();
  // buttons
  const bt=(b,label,on,big)=>{
    ctx.save(); ctx.globalAlpha=on?0.92:0.42;
    ctx.beginPath(); ctx.arc(b.cx,b.cy,b.r,0,TAU);
    ctx.fillStyle= on?SEPIA:'#efe7d4'; ctx.fill(); ctx.lineWidth=5; ctx.strokeStyle=INK; ctx.stroke();
    ctx.fillStyle=INK; ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.font='bold '+(big?13:12)+'px "Courier New",monospace';
    ctx.fillText(label,b.cx,b.cy); ctx.restore();
  };
  bt(g.bq,'QUICK',inp.quick,false);
  bt(g.bh,'HEAVY',inp.heavy,true);
  ctx.restore();
}
function drawRotate(t){
  ctx.save(); ctx.fillStyle='rgba(8,7,6,0.93)'; ctx.fillRect(0,0,VW,VH);
  const w=Math.min(420,VW-40);
  placard(VW/2-w/2, VH/2-70, w, 140, true,false); ornateFrame(VW/2-w/2, VH/2-70, w, 140);
  ctx.fillStyle=INK; ctx.textAlign='center'; ctx.font=TITLE_FONT(26);
  ctx.fillText('TURN YOUR DEVICE', VW/2, VH/2-14);
  ctx.font='italic 14px "Courier New",monospace'; ctx.fillStyle=G_DK;
  ctx.fillText('Rock, Paper, Punch! plays in landscape.', VW/2, VH/2+22);
  ctx.restore();
}

/* ============================ MENU / GAME OVER ============================ */
let menuRects={};
function menuHit(x,y){ for(const k of CLASS_KEYS){ const r=menuRects[k];
  if(r&&x>=r.x&&x<=r.x+r.w&&y>=r.y&&y<=r.y+r.h) return k; } return null; }
function drawMenu(t){
  const g=ctx.createRadialGradient(VW/2,VH*0.42,40,VW/2,VH*0.42,Math.max(VW,VH)*0.7);
  g.addColorStop(0,'#2a261d'); g.addColorStop(1,'#0a0907'); ctx.fillStyle=g; ctx.fillRect(0,0,VW,VH);
  const narrow = VW<760;
  ctx.save(); ctx.textAlign='center';
  const cardW=Math.min(680,VW-40), cardX=VW/2-cardW/2, cardH=narrow?104:126;
  ctx.translate(0,Math.sin(t*1.4)*3);
  placard(cardX, VH*0.06, cardW, cardH, true,false);
  ornateFrame(cardX, VH*0.06, cardW, cardH);
  ctx.fillStyle=INK; fitTitle('ROCK, PAPER, PUNCH!', cardW-52, narrow?34:50);
  ctx.fillText('ROCK, PAPER, PUNCH!', VW/2, VH*0.06+cardH*0.46);
  ctx.font='italic '+(narrow?12:15)+'px "Courier New",monospace'; ctx.fillStyle=G_DK;
  ctx.fillText('a rubber-hose brawl of Rock · Paper · Scissors', VW/2, VH*0.06+cardH*0.70);
  ctx.font=(narrow?9:11)+'px "Courier New",monospace'; ctx.fillStyle=G_MD;
  ctx.fillText('— a Not Tim Games picture, 1933 —', VW/2, VH*0.06+cardH*0.88);
  ctx.restore();

  ctx.save(); ctx.textAlign='center'; ctx.fillStyle=PAPER;
  ctx.font='bold '+(narrow?14:18)+'px "Courier New",monospace';
  ctx.fillText('PICK YOUR FIGHTER', VW/2, VH*0.06+cardH+28); ctx.restore();

  const bw=Math.min(210,(VW-64)/3), bh=Math.min(200,VH*0.40), gap=Math.min(28,(VW-bw*3)/4);
  const total=bw*3+gap*2, sx=VW/2-total/2, sy=VH*0.06+cardH+46;
  for(let i=0;i<3;i++){
    const k=CLASS_KEYS[i], x=sx+i*(bw+gap), C=CLASSES[k];
    menuRects[k]={x,y:sy,w:bw,h:bh};
    const hot=UI.hover===k;
    ctx.save(); if(hot) ctx.translate(0,-6);
    placard(x,sy,bw,bh,true,hot);
    ctx.save(); ctx.translate(x+bw/2, sy+bh*0.34); ctx.scale(bh/230,bh/230); drawMenuGesture(k,t); ctx.restore();
    ctx.fillStyle=INK; ctx.textAlign='center'; ctx.font='bold '+(narrow?15:19)+'px "Courier New",monospace';
    ctx.fillText(C.label, x+bw/2, sy+bh*0.635);
    ctx.font=(narrow?9:11)+'px "Courier New",monospace'; ctx.fillStyle=G_DK;
    ctx.fillText(C.title, x+bw/2, sy+bh*0.715);
    ctx.fillText(C.blurb, x+bw/2, sy+bh*0.795);
    ctx.fillStyle=SEPIA; ctx.font='bold '+(narrow?9:10)+'px "Courier New",monospace';
    ctx.fillText('HP '+C.hp+'  ATK '+C.atk+'  SPD '+C.speed, x+bw/2, sy+bh*0.895);
    ctx.restore();
  }
  ctx.save(); ctx.textAlign='center'; ctx.fillStyle=G_MD; ctx.font=(narrow?10:12)+'px "Courier New",monospace';
  ctx.fillText('D-pad: ←→ walk · ↑ jump · ↓ dodge (1s invincible)   ·   QUICK + HEAVY to brawl', VW/2, sy+bh+26);
  ctx.fillStyle=G_DK;
  ctx.fillText('Endless. 5 lives. Level up, rank up, and find ink to heal.', VW/2, sy+bh+44);
  ctx.restore();
}
function drawOver(t){
  G.overT+=RDT;
  ctx.save(); ctx.fillStyle='rgba(8,7,6,'+Math.min(0.84,G.overT)+')'; ctx.fillRect(0,0,VW,VH);
  const k=Math.min(1,G.overT*1.3);
  ctx.translate(VW/2, VH/2-20); ctx.scale(k,k);
  const cardW=Math.min(600,VW-50);
  placard(-cardW/2,-118,cardW,214,true,false); ornateFrame(-cardW/2,-118,cardW,214);
  ctx.fillStyle=INK; ctx.textAlign='center'; fitTitle("AND THAT'S A WRAP", cardW-52, 42);
  ctx.fillText("AND THAT'S A WRAP", 0,-56);
  ctx.font='italic 16px "Courier New",monospace'; ctx.fillStyle=G_DK;
  ctx.fillText('You went down swinging as a '+rankName(G.cls,G.level)+'.', 0,-22);
  ctx.font='bold 15px "Courier New",monospace'; ctx.fillStyle=INK;
  ctx.fillText('SCORE '+Math.floor(G.score)+'   ·   '+Math.floor(G.dist/10)+' m   ·   '+G.kills+' KO', 0, 10);
  ctx.font='12px "Courier New",monospace'; ctx.fillStyle=G_DK;
  ctx.fillText('Level '+G.level+'   ·   best combo '+G.comboBest+'x'+(BEST?('   ·   best score '+Math.floor(BEST)):''), 0, 34);
  ctx.font='11px "Courier New",monospace'; ctx.fillStyle=G_MD;
  ctx.fillText("· that's all, folks — or is it? ·", 0, 64);
  ctx.restore();
  const bw=Math.min(240,VW-80), bh=54;
  overBtn={x:VW/2-bw/2, y:VH/2+112, w:bw, h:bh};
  const hot=mouseIn&&hitRect(mouseX,mouseY,overBtn);
  placard(overBtn.x,overBtn.y,bw,bh,true,hot);
  ctx.save(); ctx.fillStyle=INK; ctx.textAlign='center'; ctx.textBaseline='middle';
  ctx.font='bold 19px "Courier New",monospace';
  ctx.fillText('ROLL IT AGAIN', VW/2, overBtn.y+bh/2); ctx.restore();
}

/* ========================= PROJECTOR OVERLAY ============================== */
const grain=document.createElement('canvas'); grain.width=160; grain.height=160;
(function(){ const g=grain.getContext('2d'), img=g.createImageData(160,160);
  for(let i=0;i<img.data.length;i+=4){ const v=Math.random()*255;
    img.data[i]=img.data[i+1]=img.data[i+2]=v; img.data[i+3]=Math.random()*40; }
  g.putImageData(img,0,0); })();
let flickT=0, flickV=0;
function drawOverlay(t){
  const g=ctx.createRadialGradient(VW/2,VH/2,Math.min(VW,VH)*0.34, VW/2,VH/2,Math.max(VW,VH)*0.72);
  g.addColorStop(0,'rgba(0,0,0,0)'); g.addColorStop(1,'rgba(0,0,0,0.55)');
  ctx.fillStyle=g; ctx.fillRect(0,0,VW,VH);
  ctx.save(); ctx.globalAlpha=0.5;
  const ox=(Math.random()*160)|0, oy=(Math.random()*160)|0;
  for(let x=-ox;x<VW;x+=160) for(let y=-oy;y<VH;y+=160) ctx.drawImage(grain,x,y);
  ctx.restore();
  flickT-=RDT;
  if(flickT<=0){ flickT=Math.random()*0.5+0.1; flickV=(Math.random()<0.3)?(Math.random()*0.12):0; }
  if(flickV>0){ ctx.fillStyle='rgba(0,0,0,'+flickV+')'; ctx.fillRect(0,0,VW,VH); }
  if(Math.random() < 3.6*RDT){ ctx.save(); ctx.strokeStyle='rgba(240,235,220,0.10)'; ctx.lineWidth=1;
    const x=Math.random()*VW; ctx.beginPath(); ctx.moveTo(x,0); ctx.lineTo(x+(Math.random()*8-4),VH); ctx.stroke(); ctx.restore(); }
}

/* ================================= RENDER ================================= */
function render(t){
  ctx.setTransform(DPR,0,0,DPR,0,0);
  ctx.clearRect(0,0,VW,VH);
  if(UI.mode==='menu'){ drawMenu(t); drawOverlay(t); if(VH>VW) drawRotate(t); return; }
  drawSky(t);
  drawParallax(t);
  const sh = G.shakeT>0 ? G.shakeMag : 0;
  const shx = sh? (hash2(Math.floor(t*90),1)-0.5)*sh*2 : 0;
  const shy = sh? (hash2(Math.floor(t*90),2)-0.5)*sh*2 : 0;
  ctx.save();
  const Z=zoomLevel();
  ctx.setTransform(DPR*Z,0,0,DPR*Z, (-G.camX*Z+shx)*DPR, shy*DPR);
  drawGround(t); drawProps(t); drawPickups(t);
  for(const e of G.enemies) drawUnit(e,t,false);
  drawUnit(G.player,t,true);
  for(const q of G.projectiles) drawProjectile(q,t);
  drawParticles(t);
  ctx.restore();
  drawHUD(t);
  drawLowHpPulse();
  drawControls(t);
  if(UI.mode==='over') drawOver(t);
  drawOverlay(t);
  if(VH>VW) drawRotate(t);
}

/* ================================== AUDIO ================================= */
const Audio=(function(){
  let ac=null, master=null, started=false, muted=false; const last={};
  function ensure(){ if(ac) return;
    try{ ac=new (window.AudioContext||window.webkitAudioContext)();
      master=ac.createGain(); master.gain.value=muted?0:0.5; master.connect(ac.destination); }catch(e){} }
  function resumeOnGesture(){ ensure(); if(ac&&ac.state==='suspended') ac.resume();
    if(!started){ started=true; startBed(); } }
  function tone(freq,dur,type,vol,when){ if(!ac||muted) return;
    const o=ac.createOscillator(), g=ac.createGain(); o.type=type||'sine'; o.frequency.value=freq;
    const t0=when||ac.currentTime;
    g.gain.setValueAtTime(0.0001,t0); g.gain.exponentialRampToValueAtTime(vol||0.2,t0+0.01);
    g.gain.exponentialRampToValueAtTime(0.0001,t0+dur);
    o.connect(g); g.connect(master); o.start(t0); o.stop(t0+dur+0.02); }
  function sweep(f0,f1,dur,type,vol){ if(!ac||muted) return;
    const o=ac.createOscillator(), g=ac.createGain(); o.type=type||'sine'; const t0=ac.currentTime;
    o.frequency.setValueAtTime(f0,t0); o.frequency.exponentialRampToValueAtTime(f1,t0+dur);
    g.gain.setValueAtTime(vol||0.2,t0); g.gain.exponentialRampToValueAtTime(0.0001,t0+dur);
    o.connect(g); g.connect(master); o.start(t0); o.stop(t0+dur+0.02); }
  function noise(dur,vol){ if(!ac||muted) return;
    const n=ac.sampleRate*dur|0, buf=ac.createBuffer(1,n,ac.sampleRate), d=buf.getChannelData(0);
    for(let i=0;i<n;i++) d[i]=(Math.random()*2-1)*(1-i/n);
    const s=ac.createBufferSource(); s.buffer=buf; const g=ac.createGain(); g.gain.value=vol||0.2;
    s.connect(g); g.connect(master); s.start(); }
  function throttled(key,ms){ const now=performance.now(); if((last[key]||0)+ms>now) return false; last[key]=now; return true; }
  let bedTimer=null, step=0; const tempo=0.30;
  const bass=[130.81,196.00,164.81,196.00,146.83,196.00,130.81,98.00];
  const chords=[[261.63,329.63,392.00],[293.66,349.23,440.00]];
  function startBed(){ if(bedTimer||!ac) return;
    bedTimer=setInterval(()=>{ if(muted) return;
      const t=ac.currentTime, b=bass[step%bass.length];
      tone(b,tempo*0.9,'triangle',0.14,t);
      if(step%2===1){ const ch=chords[(step>>1)%chords.length]; for(const f of ch) tone(f*2,tempo*0.5,'square',0.035,t); }
      if(step%4===2) tone(chords[0][step%3]*2, tempo*0.6,'sine',0.045,t);
      step++;
    }, tempo*1000); }
  return {
    resumeOnGesture,
    squeak(){ if(!throttled('sq',60))return; sweep(700,1500,0.08,'sine',0.18); },
    boing(){ if(!throttled('bo',70))return; sweep(620,140,0.20,'sine',0.20); },
    pop(){ if(!throttled('pp',40))return; sweep(400,900,0.07,'triangle',0.13); },
    march(){ if(!throttled('mar',70))return; noise(0.05,0.10); tone(180,0.07,'square',0.07); },
    hitTick(){ if(!throttled('hit',45))return; noise(0.035,0.10); tone(90,0.05,'square',0.09); },
    crash(){ noise(0.35,0.26); sweep(300,60,0.45,'sawtooth',0.16); },
    deny(){ if(!throttled('dn',120))return; sweep(200,120,0.12,'sawtooth',0.12); },
    fanfare(){ [392,494,587,784].forEach((f,i)=>tone(f,0.5,'square',0.15,(ac?ac.currentTime:0)+i*0.15)); },
    sadTrombone(){ [294,277,262,247].forEach((f,i)=>tone(f,0.45,'sawtooth',0.16,(ac?ac.currentTime:0)+i*0.22)); },
    toggleMute(){ muted=!muted; if(master) master.gain.value=muted?0:0.5; },
    get muted(){ return muted; }
  };
})();

/* =================================== LOOP ================================= */
function frame(now){
  const t=now/1000;
  if(!frame.last) frame.last=t;
  let dt=t-frame.last; frame.last=t; if(dt>0.25) dt=0.25;
  RDT=dt;
  if(blocked()){                        // freeze the run while rotated; don't bank up catch-up time
    frame.acc=0; if(touches.size) clearInput();
    render(t); requestAnimationFrame(frame); return; }
  frame.acc=(frame.acc||0)+dt;
  let steps=0;
  while(frame.acc>=STEP && steps<6){ update(STEP); frame.acc-=STEP; steps++; }
  if(steps===6) frame.acc=0;
  render(t);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
