<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 108 108">
  <!-- Adaptive-icon foreground: an armoured blob knight standing in the arena ring.
       108x108 canvas, art kept inside the 66-unit safe circle. -->
  <defs>
    <linearGradient id="shell" x1="0.3" y1="0" x2="0.7" y2="1">
      <stop offset="0" stop-color="#63ad7c"/>
      <stop offset="0.45" stop-color="#357d55"/>
      <stop offset="1" stop-color="#1b4030"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff3c4"/>
      <stop offset="0.45" stop-color="#ffd24a"/>
      <stop offset="1" stop-color="#c07d10"/>
    </linearGradient>
    <linearGradient id="visor" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#9ff0ff"/>
      <stop offset="0.5" stop-color="#3fd8ff"/>
      <stop offset="1" stop-color="#7fe6ff"/>
    </linearGradient>
    <linearGradient id="ringGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#9fe0ff"/>
      <stop offset="0.5" stop-color="#2f7fd0"/>
      <stop offset="1" stop-color="#8ad4ff"/>
    </linearGradient>
    <radialGradient id="ringGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0.5" stop-color="#1d8fe0" stop-opacity="0"/>
      <stop offset="0.82" stop-color="#1d8fe0" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#1d8fe0" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="floor" cx="0.5" cy="0.45" r="0.6">
      <stop offset="0" stop-color="#8fd4ff" stop-opacity="0.42"/>
      <stop offset="1" stop-color="#1d8fe0" stop-opacity="0.08"/>
    </radialGradient>
  </defs>

  <ellipse cx="54" cy="74" rx="36" ry="17" fill="url(#ringGlow)"/>
  <ellipse cx="54" cy="74" rx="28" ry="10.5" fill="url(#floor)"/>
  <!-- back half of the ring -->
  <path d="M26 74 A28 10.5 0 0 1 82 74" fill="none" stroke="#0a1422" stroke-width="4"/>
  <path d="M26 74 A28 10.5 0 0 1 82 74" fill="none" stroke="url(#ringGrad)" stroke-width="2.2"/>

  <!-- floating gauntlets -->
  <g>
    <path d="M24 60 q-5 3 -4 8 q1 5 7 5 q6 0 7-5 q1-5 -4-8 z" fill="url(#shell)" stroke="#0d2117" stroke-width="1.6" stroke-linejoin="round"/>
    <path d="M21 67 h13" stroke="url(#gold)" stroke-width="2" stroke-linecap="round"/>
    <path d="M84 60 q5 3 4 8 q-1 5 -7 5 q-6 0 -7-5 q-1-5 4-8 z" fill="url(#shell)" stroke="#0d2117" stroke-width="1.6" stroke-linejoin="round"/>
    <path d="M74 67 h13" stroke="url(#gold)" stroke-width="2" stroke-linecap="round"/>
  </g>

  <!-- horns -->
  <path d="M40 30 q-4-9 2-14 q1 8 6 11 z" fill="url(#gold)" stroke="#5a3402" stroke-width="1.1" stroke-linejoin="round"/>
  <path d="M68 30 q4-9 -2-14 q-1 8 -6 11 z" fill="url(#gold)" stroke="#5a3402" stroke-width="1.1" stroke-linejoin="round"/>

  <!-- body: a blob knight, wider at the base -->
  <path d="M54 24 c13 0 21.5 11 21.5 24 c0 13 -9 21.5 -21.5 21.5 c-12.5 0 -21.5 -8.5 -21.5 -21.5 c0 -13 8.5 -24 21.5 -24 z"
        fill="url(#shell)" stroke="#0d2117" stroke-width="2.2" stroke-linejoin="round"/>
  <path d="M40 33 q14 -8 28 0 q-14 -3 -28 0 z" fill="#ffffff" opacity="0.18"/>
  <!-- gold brow band + centre ridge -->
  <path d="M34 40 q20 -7 40 0" fill="none" stroke="url(#gold)" stroke-width="3.4" stroke-linecap="round"/>
  <path d="M54 46 v22" fill="none" stroke="url(#gold)" stroke-width="2" stroke-opacity="0.75" stroke-linecap="round"/>
  <!-- visor -->
  <path d="M38 48 q16 -6 32 0 q-16 9 -32 0 z" fill="url(#visor)" stroke="#0d2117" stroke-width="1.4" stroke-linejoin="round"/>
  <!-- shoulder plates -->
  <path d="M33 54 q-4 8 2 13" fill="none" stroke="#0d2117" stroke-width="1.6" stroke-opacity="0.55" stroke-linecap="round"/>
  <path d="M75 54 q4 8 -2 13" fill="none" stroke="#0d2117" stroke-width="1.6" stroke-opacity="0.55" stroke-linecap="round"/>

  <!-- front half of the ring, over the knight's base -->
  <path d="M26 74 A28 10.5 0 0 0 82 74" fill="none" stroke="#0a1422" stroke-width="4"/>
  <path d="M26 74 A28 10.5 0 0 0 82 74" fill="none" stroke="url(#ringGrad)" stroke-width="2.2"/>
  <path d="M26 74 A28 10.5 0 0 0 82 74" fill="none" stroke="#dff3ff" stroke-width="0.5" stroke-opacity="0.85"/>
</svg>
