function renderMarketLayout(force=false){
  if(!boardSvg.firstElementChild) mountMarketBoard();
  const key=S.tier+':'+JSON.stringify(S.fixtures);
  const changed=boardView.key!==key;
  if(changed || force){
    boardView.key=key;
    clearMarketTraffic();
    const pieces=document.getElementById('marketPieces');
    pieces.innerHTML=S.fixtures.map(f=>{
      const [x,y]=tilePoint(f.tile);
      return `<g class="market-fixture" data-square="${f.tile}" data-fixture-type="${f.type}" transform="translate(${x} ${y})" aria-hidden="true">${fixtureArt(f)}</g>`;
    }).join('');
    boardView.fixtureNodes=S.fixtures.map((f,i)=>({node:pieces.children[i], y:tilePoint(f.tile)[1], id:'fixture'+f.tile}));
  }
  boardSvg.querySelectorAll('.market-square').forEach(s=>{
    const tile=Number(s.dataset.square);
    s.setAttribute('aria-label',squareLabel(tile));
    s.setAttribute('aria-pressed',String(tile===boardView.selected));
    s.setAttribute('tabindex',tile===boardView.focus?'0':'-1');
  });
  if(changed || force || !boardInspector.firstElementChild) renderMarketInspector();
  syncMarket();
}
function syncMarket(){
  const text=`${S.fixtures.length} / ${tier().slots} displays installed`;
  const capacity=document.getElementById('marketCapacity');
  if(capacity.textContent!==text) capacity.textContent=text;
  const pace=document.getElementById('marketPace');
  const state=S.speed?'Market open':'Paused';
  if(pace.textContent!==state){
    pace.textContent=state;
    pace.parentElement.dataset.paused=String(!S.speed);
  }
  const summary=boardInspector.querySelector('[data-stock-summary]');
  if(summary){
    const pid=summary.dataset.stockSummary;
    const next=`${fmtStock(units(pid))} in stock · ${money(S.products[pid].price)} each`;
    if(summary.textContent!==next) summary.textContent=next;
  }
}
function marketNotice(text,error=false){
  boardStatus.textContent=text;
  boardStatus.dataset.error=String(error);
}
function marketChoices(){
  const empty=Array.from({length:64},(_,i)=>i).filter(i=>
    i!==GroceryBoard.entry && i!==GroceryBoard.exit && !fixtureAt(i));
  const choices=empty.map(i=>`<option value="${i}">${squareName(i)}</option>`).join('');
  return `<label class="market-field">Destination square<select id="marketSquareChoice">${choices}</select></label><div class="board-actions"><button type="button" class="primary" id="marketChooseSquare" ${choices?'':'disabled'}>${boardView.moving===null?'Place here':'Move here'}</button>${boardView.moving!==null?'<button type="button" id="marketCancel">Cancel</button>':''}</div>`;
}
function renderMarketInspector(){
  document.querySelectorAll('[data-market-mode]').forEach(button=>
    button.setAttribute('aria-pressed',String(button.dataset.marketMode===boardView.tool && boardView.moving===null)));
  const f=fixtureAt(boardView.selected);
  if(boardView.moving!==null){
    boardInspector.innerHTML=`<div class="board-selected-head"><div><b>Move ${fixtureName(fixtureAt(boardView.moving).type).toLowerCase()}</b><small>From ${squareName(boardView.moving)}</small></div></div>
      <p class="board-inspector-copy">Tap an empty square or choose one below.</p>${marketChoices()}`;
  }else if(boardView.tool!=='inspect'){
    boardInspector.innerHTML=`<div class="board-selected-head"><div><b>Place a ${boardView.tool}</b></div></div>
      <p class="board-inspector-copy">Tap an empty square or choose one below.</p>${marketChoices()}`;
  }else if(f){
    const options=CATALOG.filter(p=>p.tier<=S.tier).map(p=>{
      const used=fixtureFor(p.id);
      return `<option value="${p.id}" ${p.id===f.product?'selected':''} ${used&&used.tile!==f.tile?'disabled':''}>${p.name}${used&&used.tile!==f.tile?' · '+squareName(used.tile):''}</option>`;
    }).join('');
    boardInspector.innerHTML=`<div class="board-selected-head">${produceArt(f.product)}<div><b>${f.product?CAT[f.product].name:fixtureName(f.type)}</b><small>${squareName(f.tile)}${' · '+fixtureName(f.type)+(f.product?'':' · Empty')}</small></div></div>
      <label class="market-field">Product<select id="marketProduct"><option value="">No product</option>${options}</select></label>
      ${f.product?`<p class="board-inspector-copy" data-stock-summary="${f.product}"></p>`:''}
      <div class="board-actions">${f.product?'<button type="button" class="primary" id="marketStock">Restock</button>':''}<button type="button" id="marketMove">Move</button><button type="button" id="marketRemove">Remove</button></div>`;
  }else{
    const isDoor=boardView.selected===GroceryBoard.entry||boardView.selected===GroceryBoard.exit;
    boardInspector.innerHTML=`<div class="board-selected-head"><div><b>${boardView.selected===GroceryBoard.entry?'Entrance':boardView.selected===GroceryBoard.exit?'Exit':'Open floor'}</b><small>${squareName(boardView.selected)}</small></div></div>
      <p class="board-inspector-copy">${isDoor?'Keep this square clear for shoppers.':'Choose Stand or Shelf to place a grocery display.'}</p>`;
  }
  syncMarket();
}
function selectMarketSquare(tile){
  boardView.selected=tile;
  boardView.focus=tile;
  renderMarketLayout();
}
function applyMarketLayout(fixtures,message){
  const result=commitLayout(fixtures);
  if(!result.ok){ marketNotice(result.reason,true); return false; }
  boardView.moving=null;
  boardView.tool='inspect';
  renderShelfStatic();
  renderMarketInspector();
  marketNotice(message);
  return true;
}
function useMarketSquare(tile){
  if(!GroceryBoard.isTile(tile)) return;
  if(boardView.moving!==null || boardView.tool!=='inspect'){
    const origin=boardView.moving;
    const from=origin===null?null:fixtureAt(origin);
    const proposed={tile,type:from?from.type:boardView.tool,product:from?from.product:null};
    const attempt=GroceryBoard.place(S.fixtures,proposed,origin===null?undefined:origin);
    if(!attempt.ok){ marketNotice(attempt.reason,true); return; }
    const previous=boardView.selected;
    boardView.selected=boardView.focus=tile;
    const message=fixtureName(proposed.type)+(from?' moved to ':' placed at ')+squareName(tile)+'.';
    if(!applyMarketLayout(attempt.fixtures,message)) boardView.selected=boardView.focus=previous;
    return;
  }
  selectMarketSquare(tile);
  renderMarketInspector();
  marketNotice('');
}
function resetMarketView(){
  boardView.tool='inspect';
  boardView.selected=boardView.focus=S.fixtures[0]?.tile??0;
  boardView.moving=null;
  marketNotice('');
  renderMarketLayout(true);
}
document.querySelector('.market-tools').addEventListener('click',e=>{
  const button=e.target.closest('[data-market-mode]');
  if(!button) return;
  boardView.tool=button.dataset.marketMode;
  boardView.moving=null;
  renderMarketInspector();
  marketNotice('');
});
boardSvg.addEventListener('click',e=>{
  const square=e.target.closest('[data-square]');
  if(square) useMarketSquare(Number(square.dataset.square));
});
boardSvg.addEventListener('keydown',e=>{
  const square=e.target.closest('.market-square');
  if(!square) return;
  const current=Number(square.dataset.square);
  if(e.key==='Enter'||e.key===' '){
    e.preventDefault();
    useMarketSquare(current);
    return;
  }
  const steps={ArrowRight:1,ArrowLeft:-1,ArrowUp:-8,ArrowDown:8};
  if(!(e.key in steps)) return;
  e.preventDefault();
  const next=current+steps[e.key];
  if(!GroceryBoard.isTile(next)|| (Math.abs(steps[e.key])===1&&Math.floor(next/8)!==Math.floor(current/8))) return;
  boardView.focus=next;
  square.setAttribute('tabindex','-1');
  const target=boardSvg.querySelector('.market-square[data-square="'+next+'"]');
  target.setAttribute('tabindex','0');
  target.focus();
});
boardInspector.addEventListener('change',e=>{
  if(e.target.id!=='marketProduct') return;
  const pid=e.target.value||null;
  const tile=boardView.selected;
  const next=S.fixtures.map(f=>f.tile===tile?{...f,product:pid}:f);
  if(!applyMarketLayout(next,pid?CAT[pid].name+' assigned to '+squareName(tile)+'.':'Product removed from display.')) renderMarketInspector();
  document.getElementById('marketProduct')?.focus();
});
boardInspector.addEventListener('click',e=>{
  const id=e.target.closest('button')?.id;
  if(id==='marketChooseSquare'){
    useMarketSquare(Number(document.getElementById('marketSquareChoice').value));
    if(!document.getElementById('marketChooseSquare')) document.getElementById('marketProduct')?.focus();
  }else if(id==='marketMove'){
    boardView.moving=boardView.selected;
    renderMarketInspector();
    document.getElementById('marketSquareChoice')?.focus();
    marketNotice('');
  }else if(id==='marketCancel'){
    boardView.moving=null;
    renderMarketInspector();
    document.getElementById('marketMove')?.focus();
    marketNotice('');
  }else if(id==='marketRemove'){
    const tile=boardView.selected;
    applyMarketLayout(S.fixtures.filter(f=>f.tile!==tile),'Display removed from '+squareName(tile)+'.');
  }else if(id==='marketStock'){
    restockState.pid=fixtureAt(boardView.selected).product;
    openTab('restock');
  }
});
document.getElementById('marketHelp').onclick=showHelp;

function clearMarketTraffic(){
  for(const actor of boardView.actors) actor.node.remove();
  boardView.actors=[];
  boardView.pending=[];
  boardView.order='';
  boardView.lastSpawn=-Infinity;
  document.getElementById('marketEffects')?.replaceChildren();
}
function marketVisitor(pid,outcome,revenue=0){
  if(!boardSvg.firstElementChild) return;
  if(boardView.pending.length>=BOARD_ART.maxPending){
    const sample=boardView.pending.findIndex(visitor=>visitor.outcome!=='sale');
    if(outcome!=='sale' || sample===-1) return;
    boardView.pending.splice(sample,1);
  }
  boardView.pending.push({pid,outcome,revenue});
}
function spawnMarketVisitor(){
  const visit=boardView.pending.shift();
  const display=fixtureFor(visit.pid);
  const trip=display?GroceryBoard.visit(S.fixtures,display.tile):null;
  const path=trip?.path||GroceryBoard.path(S.fixtures);
  if(!path) return;
  const piece=['Pawn','Rook','Bishop','Knight','Queen'][boardView.serial%5];
  const tone=['Ivory','Lilac','Gold'][boardView.serial%3];
  const node=document.createElementNS(SVG_NS,'g');
  node.classList.add('market-actor');
  node.setAttribute('aria-hidden','true');
  node.innerHTML=`<g fill="url(#chess${tone})" stroke="#3d2940" stroke-width="1.15" stroke-linejoin="round"><use href="#chessBase"/><use href="#chess${piece}"/></g>`;
  const id='visitor'+ ++boardView.serial;
  const positions=path.map(tilePoint);
  const offset=14;
  const outside=([x,y])=>[x-offset,y+offset/2];
  positions.unshift(outside(positions[0]));
  positions.push(outside(positions[positions.length-1]));
  boardView.actors.push({
    ...visit,node,id,positions,tilePath:path,born:boardView.elapsed,y:0,
    stop:trip?trip.stopIndex+1:-1,saleShown:false,
  });
  boardView.lastSpawn=boardView.elapsed;
}
function stepMarket(dt){
  if(!S.speed || !boardSvg.firstElementChild) return;
  boardView.elapsed+=dt*Math.min(S.speed,2.2);
  if(boardView.pending.length && boardView.actors.length<BOARD_ART.maxVisitors &&
      boardView.elapsed-boardView.lastSpawn>=BOARD_ART.spawnInterval) spawnMarketVisitor();
  for(let index=boardView.actors.length-1;index>=0;index--){
    const actor=boardView.actors[index];
    const elapsed=boardView.elapsed-actor.born;
    const pause=actor.stop>=0?BOARD_ART.shopMs:0;
    const dwellAt=actor.stop*BOARD_ART.moveMs;
    let traveled=elapsed;
    if(actor.stop>=0 && elapsed>=dwellAt) traveled-=Math.min(elapsed-dwellAt,pause);
    if(!actor.saleShown && actor.revenue>0 && actor.stop>=0 && elapsed>=dwellAt){
      actor.saleShown=true;
      const [x,y]=actor.positions[actor.stop];
      const label=document.createElementNS(SVG_NS,'text');
      label.setAttribute('class','market-sale');
      label.setAttribute('x',x);
      label.setAttribute('y',y-56);
      label.setAttribute('text-anchor','middle');
      label.textContent='+'+money(actor.revenue);
      document.getElementById('marketEffects').append(label);
      const animation=label.animate([{transform:'translateY(0)',opacity:1},{transform:'translateY(-22px)',opacity:0}],{duration:780,easing:'ease-out'});
      animation.onfinish=()=>label.remove();
    }
    const step=traveled/BOARD_ART.moveMs;
    const segment=Math.floor(step);
    if(segment>=actor.positions.length-1){ actor.node.remove(); boardView.actors.splice(index,1); continue; }
    const [x1,y1]=actor.positions[segment];
    const [x2,y2]=actor.positions[segment+1];
    const frac=step-segment;
    const x=x1+(x2-x1)*frac;
    const y=y1+(y2-y1)*frac;
    actor.y=y;
    actor.node.setAttribute('transform',`translate(${x.toFixed(1)} ${y.toFixed(1)})`);
  }
  const ordered=boardView.fixtureNodes.concat(boardView.actors).sort((a,b)=>a.y-b.y);
  const order=ordered.map(item=>item.id).join(',');
  if(order!==boardView.order){
    document.getElementById('marketPieces').replaceChildren(...ordered.map(item=>item.node));
    boardView.order=order;
  }
}

window.render_game_to_text=()=>JSON.stringify({
  coordinates:'Rows 8 to 1, rear to front along the left edge. Files A to H, left to right along the right edge.',
  day:S.day,cash:+S.cash.toFixed(2),speed:S.speed,tier:S.tier,fixturesAvailable:tier().slots,
  entrance:squareName(GroceryBoard.entry),exit:squareName(GroceryBoard.exit),
  tool:boardView.moving===null?boardView.tool:'move',selected:squareName(boardView.selected),
  fixtures:S.fixtures.map(f=>({...f,square:squareName(f.tile),stock:f.product?units(f.product):0})),
  customers:boardView.actors.map(a=>({outcome:a.outcome,product:a.pid,route:a.tilePath.map(squareName)})),
  unitsSold:S.stats.itemsSold,notice:boardStatus.textContent,
});


function init(){
  RT={dirtyTiles:{}, sessionDays:0, dayClock:0, lastFrame:performance.now(),
      everProfitDay:false, pauseStart:0};
  const had=load();
  if(!had){ S=freshState(); S.today=freshDay(); }
  // restore speed UI
  if(S.speed===undefined) S.speed=1;
  document.querySelectorAll('#speedCtl button').forEach(bn=>bn.classList.toggle('on', +bn.dataset.spd===S.speed));
  if(S.speed===0) RT.pauseStart=performance.now();   // arm Idle Hands timer if loaded paused
  // re-evaluate any already-satisfied achievements silently-ish (avoid spamming on first load of existing save)
  if(had){ for(const a of ACH){ if(!(S.ach[a.id]&&S.ach[a.id].un)){ try{ if(a.chk()){ S.ach[a.id]={un:true,day:S.day}; } }catch(e){} } } }
  if(had) resumeDay(); else startDay(true);
  fullRender();
  // autosave heartbeat
  setInterval(()=>{ save(); }, 3000);
  requestAnimationFrame(frame);
}
init();
</script>
