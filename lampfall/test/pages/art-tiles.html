<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Art tiles sheet</title>
<link rel="icon" href="data:,">
<style>
  :root { --ink: #141B33; --paper: #F4F1E6; --rule: #C9A77C; --deep: #2B3A67; --wax: #A8323A; }
  html, body { margin: 0; background: var(--ink); color: var(--paper); font: 11px/1.3 ui-monospace, monospace; }
  header { padding: 6px 10px; display: flex; gap: 12px; align-items: baseline; flex-wrap: wrap; border-bottom: 1px solid var(--deep); }
  header b { font-size: 13px; }
  header a { color: var(--rule); }
  h2 { margin: 10px 10px 4px; font-size: 12px; color: var(--rule); text-transform: uppercase; letter-spacing: 1px; }
  .grid { display: flex; flex-wrap: wrap; gap: 6px 8px; padding: 2px 10px 8px; align-items: flex-end; }
  figure { margin: 0; display: flex; flex-direction: column; align-items: center; }
  figure canvas { image-rendering: pixelated; image-rendering: crisp-edges; background: #3B3A48; outline: 1px solid #4E4C62; }
  figure.checker canvas { background-image: linear-gradient(45deg, #4E4C62 25%, transparent 25%, transparent 75%, #4E4C62 75%), linear-gradient(45deg, #4E4C62 25%, transparent 25%, transparent 75%, #4E4C62 75%); background-size: 24px 24px; background-position: 0 0, 12px 12px; }
  figcaption { max-width: 112px; text-align: center; color: #D6C8A6; margin-top: 2px; word-break: break-all; }
  figcaption i { color: #8E9AA6; font-style: normal; }
  #err { color: #F9C46B; white-space: pre-wrap; padding: 10px; }
</style>
</head>
<body>
<header><b>LAMPFALL art: tiles &amp; props @3x</b><span id="info"></span>
  <span>?group=ground|water|stone|wood|flora|buildings|lighthouse|props|ui · hour=0..24 · weather · frame · tiling=1 · scale</span></header>
<div id="root"></div>
<div id="err"></div>
<script type="module">
  import { TILE_GROUPS } from '../../js/art/tiles/index.js';
  import { PROP_ART } from '../../js/art/props.js';
  import { UI_ART } from '../../js/art/ui.js';
  import { getSprite, getTile, artDef, atlasStats } from '../../js/art/atlas.js';
  import { gradeFor } from '../../js/world/lighting.js';

  const q = new URLSearchParams(location.search);
  const scale = Number(q.get('scale') || 3);
  const frame = Number(q.get('frame') || 0);
  const hour = q.has('hour') ? Number(q.get('hour')) : null;
  const weather = q.get('weather') || 'clear';
  const grade = hour === null ? null : gradeFor(hour * 60, weather, q.get('indoor') === '1');
  const tiling = q.get('tiling') === '1';
  const only = q.get('group');
  const filter = q.get('filter');
  const root = document.getElementById('root');
  document.getElementById('info').textContent = grade ? `grade ${grade.id}` : 'ungraded';

  const sections = { ...TILE_GROUPS, props: PROP_ART, ui: UI_ART };
  let count = 0;
  try {
    for (const [name, table] of Object.entries(sections)) {
      if (only && only !== name) continue;
      const ids = Object.keys(table).filter((id) => !filter || id.includes(filter));
      if (!ids.length) continue;
      const h2 = document.createElement('h2');
      h2.textContent = `${name} (${ids.length})`;
      root.appendChild(h2);
      const grid = document.createElement('div');
      grid.className = 'grid';
      root.appendChild(grid);
      for (const id of ids) {
        const def = artDef(id);
        const variants = [null, ...Object.keys(def.variants || {})];
        for (const vn of variants) {
          const fig = document.createElement('figure');
          const canvas = document.createElement('canvas');
          const rep = tiling && def.w === 16 && def.h === 16 && def.kind === 'ground' ? 3 : 1;
          canvas.width = def.w * rep; canvas.height = def.h * rep;
          canvas.style.width = canvas.width * scale + 'px';
          canvas.style.height = canvas.height * scale + 'px';
          const ctx = canvas.getContext('2d');
          ctx.imageSmoothingEnabled = false;
          const opts = { frame, name: vn || undefined, grade };
          const img = name === 'props' || name === 'ui' ? getSprite(id, opts) : vn ? getSprite(id, opts) : getTile(id, frame, grade);
          for (let y = 0; y < rep; y++) for (let x = 0; x < rep; x++) ctx.drawImage(img.canvas, x * def.w, y * def.h);
          if (def.kind !== 'ground') fig.className = 'checker';
          const cap = document.createElement('figcaption');
          const nf = (vn ? def.variants[vn] : def.frames).length;
          cap.innerHTML = `${id}${vn ? '@' + vn : ''}<br><i>${def.w}×${def.h}${nf > 1 ? ' · ' + nf + 'f' : ''}${def.fps ? ' ' + def.fps + 'fps' : ''}</i>`;
          fig.append(canvas, cap);
          grid.appendChild(fig);
          count++;
        }
      }
    }
    window.__artSheet = { count, stats: atlasStats() };
  } catch (e) {
    document.getElementById('err').textContent = String(e && e.stack || e);
    console.error(e);
  }
</script>
</body>
</html>
