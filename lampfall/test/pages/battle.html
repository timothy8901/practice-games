<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Battle harness</title>
  <link rel="icon" href="data:,">
  <style>
    html, body { margin: 0; height: 100%; background: #141B33; display: grid; place-items: center; overflow: hidden; }
    canvas { width: 960px; height: 540px; image-rendering: pixelated; image-rendering: crisp-edges; touch-action: none; }
  </style>
</head>
<body>
  <canvas id="game" width="480" height="270"></canvas>
  <script type="module">
    // Battle / Forecast harness [SCN-BATTLE]. Boots a small G around the real scene stack, input,
    // store, rngs, music director and the real battle tables (scenes/battleData.js), then runs
    // scripted scenarios. `?scenario=capture|water|ward|levelup|forecast|blackout|forecastOnly|trainer`
    // starts one directly; `?noanim=1` collapses animations; `?sound=1` unmutes.
    // Harness hook: window.__bt = {run(name), state(), events, until(pred, ms), press(action, n), G}.
    import { createInput } from '../../js/core/input.js';
    import { createSceneStack } from '../../js/core/scene.js';
    import { audio } from '../../js/core/audio.js';
    import { createTweens } from '../../js/core/tween.js';
    import { createFX } from '../../js/core/fx.js';
    import { createClock } from '../../js/core/time.js';
    import { drawText } from '../../js/core/font.js';
    import { createStore } from '../../js/state/store.js';
    import { createNewWorld } from '../../js/state/schema.js';
    import { createRngs } from '../../js/state/rngs.js';
    import { DATA } from '../../js/data/index.js';
    import { createRegistry } from '../../js/data/registry.js';
    import * as clockSys from '../../js/systems/clockSys.js';
    import { createMusicDirector } from '../../js/audio/director.js';
    import { createToasts } from '../../js/ui/toast.js';
    import { drawPanel } from '../../js/ui/panel.js';
    import { sceneFactories } from '../../js/scenes/index.js';
    import { installDebugHook } from '../../js/debug/hook.js';
    import { realBattleData } from '../../js/scenes/battleData.js';
    import { tuningFor, startBattle } from '../../js/systems/flow/battleFlow.js';
    import * as party from '../../js/systems/party.js';
    import * as creature from '../../js/systems/creature.js';
    import * as bag from '../../js/systems/bag.js';
    import * as wallet from '../../js/systems/wallet.js';
    import * as flags from '../../js/systems/flags.js';

    const W = 480, H = 270;
    const q = new URLSearchParams(location.search);
    const canvas = document.getElementById('game');
    const ctx = canvas.getContext('2d');
    ctx.imageSmoothingEnabled = false;
    const input = createInput({ canvas, width: W, height: H, touch: q.get('touch') === '1' });
    if (q.get('sound') !== '1') audio.mute(true);
    window.addEventListener('pointerdown', () => audio.unlock(), { once: true });
    window.addEventListener('keydown', () => audio.unlock(), { once: true });

    const store = createStore(createNewWorld({ seedCode: q.get('seed') || 'FLUX-K7Q2-MD7F' }));
    const rngs = createRngs(store);
    const clock = createClock(clockSys.optionsFrom(store.world));
    clockSys.restoreFrom(store.world, clock);
    const scenes = createSceneStack({ input, width: W, height: H, onChange: (e) => {
      if (G && G.music) G.music.onSceneChange?.(e);
      store.bus.emit('scene:change', { type: e.type, scene: e.scene?.name ?? null, top: e.top?.name ?? null });
    } });
    const events = [];
    for (const e of ['battle:start', 'battle:hp', 'battle:event', 'battle:end', 'capture:ok', 'creature:levelUp', 'shift:window', 'shift:resolved', 'wallet:changed', 'badge:won', 'fieldLog:held']) {
      store.bus.on(e, (p) => events.push({ e, type: p && p.event ? p.event.type : undefined, p }));
    }
    const G = {
      store, get world() { return store.world; }, bus: store.bus, input, scenes, audio, music: null,
      data: createRegistry(DATA), rngs, clock, tweens: createTweens(), fx: createFX({ width: W, height: H }),
      toasts: createToasts({ width: W, height: H }), flags: { noanim: q.get('noanim') === '1', debug: true },
      sceneFactories, push(name, params) { scenes.push(sceneFactories[name](G), params); },
      replaceWith(name, params) { scenes.replace(sceneFactories[name](G), params); },
      speed: 1, lowPower: false, display: { width: W, height: H },
      loop: { paused: false, pause() {}, resume() {}, step() {} },
    };
    G.battleData = realBattleData();
    G.music = createMusicDirector(G);
    G.debugHook = installDebugHook(G, { target: window });
    G.bus.on('toast', (p) => G.toasts.show(typeof p === 'string' ? p : p?.text ?? ''));

    const data = G.battleData;
    const tuning = tuningFor(data);
    let status = 'ready';
    let last = null;

    // the harness's own base scene: a quiet desk so a popped battle lands somewhere readable
    const base = {
      name: 'harness', opaque: true,
      enter() {}, exit() {}, pause() {}, resume(r) { last = r ?? null; status = 'returned'; },
      update() {}, handleInput() {},
      draw(c) {
        c.fillStyle = '#141B33'; c.fillRect(0, 0, W, H);
        drawPanel(c, { x: 120, y: 90, w: 240, h: 90 }, 'paper', { title: 'Battle harness' });
        drawText(c, `status: ${status}`, 136, 106, { color: '#2A2433' });
        drawText(c, last && last.outcome ? `forecast: ${last.outcome}` : last && last.result ? `outcome: ${last.result.outcome}` : '', 136, 120, { color: '#2A2433' });
        drawText(c, 'scenario via ?scenario= or __bt.run()', 136, 150, { color: '#6B6275', font: 'small' });
      },
    };
    scenes.push(base);

    function freshWorld() {
      store.replace(createNewWorld({ seedCode: q.get('seed') || 'FLUX-K7Q2-MD7F' }));
      clockSys.restoreFrom(store.world, clock);
      store.tx('harness.dial', (w) => { w.run.dial = q.get('dial') || 'flux'; });
      events.length = 0;
      last = null;
    }

    function give(spec, extra = {}) {
      return store.tx('harness.give', (w) => {
        const rng = rngs.fresh(`harness:${spec.speciesId}:${w.party.length}`);
        const c = creature.makeCreature({ uid: party.nextUid(w), rng, tuning, ...spec }, data);
        if (extra.exp !== undefined) c.exp = extra.exp;
        return party.addCreature(w, c, data, { tuning, caught: extra.caught ?? true, bus: G.bus });
      });
    }
    function items(list) {
      store.tx('harness.items', (w) => { for (const [id, n] of list) bag.give(w, id, n, { data, bus: G.bus }); });
    }

    const SCENARIOS = {
      capture() {
        give({ speciesId: 'sloshkin', level: 7, nickname: 'PUDDLE' });
        items([['tallow-wick', 5], ['brass-wick', 2], ['salve', 3]]);
        return startBattle(G, { kind: 'wild', wild: { speciesId: 'tossup', level: 4, habitat: 'grass' } });
      },
      water() {
        give({ speciesId: 'sloshkin', level: 9, nickname: 'PUDDLE' });
        items([['tallow-wick', 3]]);
        return startBattle(G, { kind: 'wild', wild: { speciesId: 'rillfin', level: 6, habitat: 'water' } });
      },
      sure() {
        give({ speciesId: 'sloshkin', level: 20, nickname: 'PUDDLE' });
        items([['tallow-wick', 1], ['isoldes-lantern', 1]]);
        return startBattle(G, { kind: 'wild', wild: { speciesId: 'squallcoil', level: 22, errant: true } });
      },
      ward() {
        give({ speciesId: 'sloshkin', level: 30, nickname: 'PUDDLE' });
        give({ speciesId: 'caldermaw', level: 30, nickname: 'Cinder' });
        items([['crackdust', 2], ['salve', 2]]);
        return startBattle(G, { kind: 'trainer', trainerId: 'cairnhold-bette' });
      },
      levelup() {
        give({ speciesId: 'sloshkin', level: 8, nickname: 'PUDDLE', moves: ['tap', 'salt-spray', 'undertow', 'shell-rattle'] }, { exp: 640 });
        return startBattle(G, { kind: 'wild', wild: { speciesId: 'tossup', level: 6 } });
      },
      forecast() {
        give({ speciesId: 'sloshkin', level: 7, nickname: 'PUDDLE' }, { exp: 505 });
        store.tx('harness.forecast', (w) => {
          w.badges.push('turn');
          wallet.earn(w, 5, { currency: 'starsalt', data });
          wallet.earn(w, 2, { currency: 'anchors', data });
        });
        return startBattle(G, { kind: 'wild', wild: { speciesId: 'tossup', level: 3 } });
      },
      forecastOnly() {
        give({ speciesId: 'sloshkin', level: 8, nickname: 'PUDDLE' }, { caught: false });
        store.tx('harness.forecast', (w) => {
          w.badges.push('turn');
          wallet.earn(w, 5, { currency: 'starsalt', data });
          wallet.earn(w, 2, { currency: 'anchors', data });
          if (q.get('dial')) w.run.dial = q.get('dial');
          if (q.get('steadied')) flags.setFlag(w, 'lit.steadied', true);
        });
        return new Promise((resolve) => G.push('forecast', { uid: store.world.party[0].uid, deferrable: true, onDone: resolve }));
      },
      blackout() {
        give({ speciesId: 'puddlepip', level: 3, nickname: 'PIP' });
        store.tx('harness.cash', (w) => wallet.earn(w, 3000, { data }));
        return startBattle(G, { kind: 'trainer', trainerId: 'osric-spire' });
      },
      trainer() {
        give({ speciesId: 'sloshkin', level: 9, nickname: 'PUDDLE' });
        give({ speciesId: 'scrapling', level: 8 });
        return startBattle(G, { kind: 'trainer', trainerId: q.get('trainer') || 'lowmoor-tibby' });
      },
    };

    function run(name) {
      if (scenes.size > 1) throw new Error('a scenario is already running');
      freshWorld();
      if (q.get('dial') && name !== 'forecastOnly') store.tx('dial', (w) => { w.run.dial = q.get('dial'); });
      if (q.get('rm') === '1') store.tx('rm', (w) => { w.settings.reducedMotion = true; });
      status = `running ${name}`;
      const p = SCENARIOS[name]();
      p.then((r) => { status = `done ${name}`; last = last || (r && r.outcome ? r : { result: r }); });
      return p;
    }

    const debug = () => window.__game;
    window.__bt = {
      G, events, run,
      state() {
        const top = scenes.top();
        return {
          status, stack: scenes.stack.map((s) => s.name), scene: top?.name, text: top?.debugText ? top.debugText() : '',
          mode: top?.mode, overlay: top?.overlay ?? null, outcome: last?.outcome ?? last?.result?.outcome ?? null,
          party: store.world.party.map((c) => ({ uid: c.uid, nick: c.nickname, sp: c.speciesId, lv: c.level, exp: c.exp, hp: c.hp, moves: c.moves.map((m) => m.id) })),
          wallet: { ...store.world.wallet }, pending: store.world.pendingShifts.slice(), badges: store.world.badges.slice(),
          fieldLog: store.world.fieldLog.forms,
        };
      },
      until(pred, ms = 20000) {
        return new Promise((resolve, reject) => {
          const t0 = performance.now();
          const tick = () => {
            let ok = false;
            try { ok = pred(window.__bt.state()); } catch { ok = false; }
            if (ok) { resolve(window.__bt.state()); return; }
            if (performance.now() - t0 > ms) { reject(new Error('until: timeout ' + JSON.stringify(window.__bt.state()).slice(0, 400))); return; }
            requestAnimationFrame(tick);
          };
          tick();
        });
      },
      async press(action, n = 1) { for (let i = 0; i < n; i++) await debug().press(action, 2); },
      /**
       * Plays the battle with a simple policy until `stop` holds: 'end' (back on the harness),
       * 'learn' | 'naming' | 'readout' | 'readcard' (scene overlays), 'confirm' | 'forecast' (pushed
       * scenes), 'menu', 'blackout'. Policy: Fight with move slot `opts.move` (default 0); confirm
       * through everything else (confirms take their safe default).
       */
      async autoplay(stop = 'end', opts = {}) {
        const wait = (ms) => new Promise((r) => setTimeout(r, ms));
        for (let i = 0; i < 3000; i++) {
          const s = window.__bt.state();
          const top = scenes.top();
          if (typeof stop === 'function' && stop(s, top)) return s;
          if (stop === 'end' && s.stack.length === 1) return s;
          if (['learn', 'naming', 'readout', 'readcard', 'blackout', 'slip'].includes(stop) && s.overlay === stop) return s;
          if (stop === 'confirm' && s.scene === 'confirm') return s;
          if (stop === 'forecast' && s.scene === 'forecast') return s;
          if (stop === 'menu' && s.mode === 'menu') return s;
          if (s.scene === 'battle' && s.mode === 'menu') {
            await debug().press('confirm', 2);
            let mv = opts.move || 0;
            if (typeof opts.pick === 'function') {
              const b = top.session.battle;
              const lg = b.legal(0);
              const r = opts.pick(lg, b.state().sides[1].party[b.state().sides[1].active], b);
              if (Number.isInteger(r)) mv = r;
            }
            if (opts.move === 'best') {
              const lg = top.session.battle.legal(0);
              let best = 0, score = -1;
              lg.moves.forEach((m, i) => { const sc = m.selectable && m.power > 0 ? m.power * (m.mult ?? 1) * (m.word === 'Blocked by Ward' ? 0 : 1) : -0.5; if (sc > score) { score = sc; best = i; } });
              mv = best;
            }
            for (let k = 0; k < (mv % 2); k++) await debug().press('right', 2);
            for (let k = 0; k < Math.floor(mv / 2); k++) await debug().press('down', 2);
            await debug().press('confirm', 2);
          } else if (s.scene === 'battle' && s.overlay === 'naming') {
            // keep the offered name: Done, then "Call it …?" (answered by the confirm branch)
            const ov = top.overlayState;
            if (ov && !ov.busy && ov.done) ov.done(); else await wait(40);
            opts = { ...opts, confirmYes: true };
          } else if (s.scene === 'forecast') {
            await debug().press(top.mode === 'cards' ? 'cancel' : 'confirm', 2);
          } else if (s.scene === 'battle' && (s.mode === 'busy' || s.mode === 'intro' || s.mode === 'end' || s.mode === 'modal' || s.mode === 'party')) {
            await debug().press('confirm', 2);
          } else if (s.scene === 'confirm') {
            await wait(520);
            await debug().press(opts.confirmYes ? 'right' : 'left', 2);
            if (opts.confirmYes) await debug().press('confirm', 2); else await debug().press('cancel', 2);
          } else {
            await wait(40);
          }
        }
        return window.__bt.state();
      },
      setSpeed(n) { const top = scenes.top(); if (top && top.setSpeed) top.setSpeed(n); },
    };

    // ------------------------------------------------------------------ the scripted suite
    // `?suite=1` (or __bt.suite()) plays the five lane scenarios end to end and logs PASS / FAIL.
    async function suite() {
      const bt = window.__bt;
      const results = [];
      const check = (name, ok, detail = '') => {
        results.push({ name, ok: !!ok, detail });
        console.log(`${ok ? 'PASS' : 'FAIL'} ${name}${detail ? ' — ' + detail : ''}`);
      };
      const wait = (ms) => new Promise((r) => setTimeout(r, ms));
      const press = (a) => debug().press(a, 2);
      const types = () => events.filter((e) => e.e === 'battle:event').map((e) => e.type);
      const finished = (p) => Promise.race([p, wait(60000).then(() => 'timeout')]);

      // 1. a wild battle with a capture
      let p = run('capture');
      for (let i = 0; i < 8; i++) {
        const s = await bt.autoplay((st) => st.mode === 'menu' || st.overlay === 'naming' || st.stack.length === 1);
        if (s.mode !== 'menu') break;
        await press('right'); await press('right'); await press('confirm'); await wait(100); await press('confirm');
      }
      await bt.autoplay('end', { confirmYes: true });
      await finished(p);
      let st = bt.state();
      check('capture: the catch joined the party', st.party.length === 2 && st.party[1].sp === 'tossup', JSON.stringify(st.party.map((c) => c.sp)));
      check('capture: Field Log Held', st.fieldLog.tossup && st.fieldLog.tossup.held);
      check('capture: battle:start, battle:hp, battle:end emitted', ['battle:start', 'battle:hp', 'battle:end'].every((e) => events.some((x) => x.e === e)));
      const tt = types();
      check('capture: draw-in before the catch, in animation order', tt.indexOf('capture-shake') >= 0 && tt.indexOf('capture-shake') < tt.indexOf('capture'));
      check('capture: capture:ok released', events.some((e) => e.e === 'capture:ok'));
      check('capture: a wick burned', st.party && bt.G.world.bag.pockets.wicks.some((x) => x.id === 'tallow-wick' && x.n < 5) || !bt.G.world.bag.pockets.wicks.some((x) => x.id === 'tallow-wick'));

      // 2. a trainer with a Ward foe and the readout
      p = run('ward');
      const pickWard = (lg, foe) => {
        if (foe.speciesId === 'prismoth') { const i = lg.moves.findIndex((m) => m.selectable && m.type === 'Brine' && m.power > 0); return i >= 0 ? i : 0; }
        let best = 0, sc = -1;
        lg.moves.forEach((m, i) => { const v = m.selectable && m.power > 0 ? m.power * (m.mult ?? 1) : -1; if (v > sc) { sc = v; best = i; } });
        return best;
      };
      st = await bt.autoplay('readout', { pick: pickWard });
      check('ward: the readout opens after a blocked hit', st.overlay === 'readout', st.text);
      check('ward: Blocked by Ward sounded', types().includes('blocked') && types().includes('ward-readout'));
      await press('confirm');
      await bt.autoplay('end', { move: 'best' });
      await finished(p);
      check('ward: the battle ended', ['win', 'loss'].includes(bt.state().outcome), String(bt.state().outcome));

      // 3. a level-up with a move prompt
      p = run('levelup');
      st = await bt.autoplay('learn');
      check('levelup: the keep-or-forget prompt opens', st.overlay === 'learn');
      await press('down'); await press('down'); await press('confirm');
      await wait(560);
      await press('right'); await press('confirm');
      await wait(200);
      await bt.autoplay('end');
      await finished(p);
      st = bt.state();
      check('levelup: Settle replaced Salt Spray behind the confirm', JSON.stringify(st.party[0].moves) === JSON.stringify(['tap', 'settle', 'undertow', 'shell-rattle']), JSON.stringify(st.party[0].moves));
      check('levelup: Lv9', st.party[0].lv === 9);

      // 4. a Forecast with Reroll then Accept
      p = run('forecast');
      st = await bt.autoplay('confirm');
      await wait(560);
      await press('right'); await press('confirm');
      st = await bt.autoplay('forecast');
      check('forecast: Open now pushes the Forecast', st.scene === 'forecast');
      await wait(600);
      const before = bt.G.scenes.top().forecast.draw;
      await press('right'); await press('confirm');
      await wait(560);
      await press('right'); await press('confirm');
      await wait(300);
      const fc = bt.G.scenes.top().forecast;
      check('forecast: Reroll drew new cards and spent 1 Starsalt', fc.draw === before + 1 && bt.state().wallet.starsalt === 4, `draw ${before}->${fc.draw}, starsalt ${bt.state().wallet.starsalt}`);
      await press('left'); await press('confirm');
      await bt.autoplay((s2, top) => top && top.name === 'forecast' && top.mode === 'result');
      await press('confirm');
      await bt.autoplay('end');
      await finished(p);
      st = bt.state();
      check('forecast: Accept landed a Shift', st.party[0].sp !== 'sloshkin', st.party[0].sp);
      check('forecast: the window resolved', st.pending.length === 0);
      check('forecast: shift:resolved emitted', events.some((e) => e.e === 'shift:resolved'));

      // 5. a blackout
      p = run('blackout');
      st = await bt.autoplay('blackout');
      check('blackout: the porchlight fade and Dimity', st.overlay === 'blackout');
      await wait(1100);
      await press('confirm');
      await bt.autoplay('end');
      await finished(p);
      st = bt.state();
      check('blackout: 10% dropped, half to the Keeper\'s Purse', st.wallet.main === 2700 && st.wallet.purse === 150, `${st.wallet.main} / ${st.wallet.purse}`);
      check('blackout: woke healed', st.party[0].hp > 0);

      const failed = results.filter((r) => !r.ok).length;
      console.log(`SUITE ${failed ? 'FAILED' : 'PASSED'} ${results.length - failed}/${results.length}`);
      window.__suite = { done: true, failed, results };
      return window.__suite;
    }
    window.__bt.suite = suite;

    // fixed-step loop (as main.js)
    const TICK = 1000 / 60;
    let acc = 0, prev = performance.now();
    function frame(now) {
      requestAnimationFrame(frame);
      acc += Math.min(250, now - prev); prev = now;
      let steps = 0;
      while (acc >= TICK && steps < 4) {
        input.update(); G.toasts.update(TICK); G.tweens.update(TICK);
        scenes.handleInput(input); scenes.update(TICK);
        acc -= TICK; steps++;
      }
      if (steps === 4) acc = 0;
      scenes.draw(ctx);
      G.toasts.draw(ctx);
    }
    requestAnimationFrame(frame);
    if (q.get('scenario')) setTimeout(() => run(q.get('scenario')), Number(q.get('delay') || 50));
    if (q.get('suite') === '1') setTimeout(() => suite(), 100);
  </script>
</body>
</html>
