    display: inline-block; text-decoration: none;
    background: var(--accent); color: #2b2b40;
    border-radius: 8px; padding: 11px 22px;
    font-weight: 800; letter-spacing: 0.04em;
  }
  a.go:hover { background: #fff5a0; }
  .small { display: block; margin-top: 14px; font-size: 0.72rem; color: var(--muted); }
